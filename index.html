<script>
const STONE='<svg viewBox="2 7 60 52" width="1.3em" height="1.13em" style="display:inline-block;vertical-align:-.2em" aria-label="Pierre"><path d="M9 45C5 34 11 22 21 18C27 11 40 11 46 18C56 22 61 34 56 45C54 53 44 55 32 55C20 55 11 53 9 45Z" fill="#9ca3af" stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/><path d="M10 45C12 51 20 55 32 55C44 55 54 52 56 45C50 49 40 50 31 49C21 48 14 47 10 45Z" fill="#6b7280"/><path d="M19 27C23 20 31 18 38 19C32 21 27 24 25 31Z" fill="#e5e7eb"/><path d="M40 25L35 34L42 39" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const E={r:STONE,f:'📄',c:'✂️'},N={r:'Pierre',f:'Feuille',c:'Ciseaux'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S={cfg:null,matches:{}},tok=ls.get('pfc_tok'),adminKey=ls.get('pfc_ak')||'',adm=null,tab='jeu',sel=null,lg={id:null,pin:'',err:false},remember=true,busy=false,prevTurn=null,loaded=false,confirmReset=false,loadErr=null,lastSig='',popKey='',bigBoard=false,skew=0,watch=null,confSig='',confRaf=null,aboutOpen={rules:true,hist:false,rank:true},souv=false,CL=null,clAll=false;   // souv : mode « souvenir » (tableau figé lu dans souvenir.json, aucun appel au serveur)
$('#ttl').innerHTML='<div>'+STONE+' 📄 ✂️</div><div class="text-lg mt-1">Master Chifoumi — Édition RSP 2026</div>';

async function api(action,extra){
  if(souv)throw Object.assign(new Error('souvenir'),{status:0});
  const r=await fetch('/api/pfc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:tok,key:adminKey,...extra})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'erreur'),{status:r.status,data:j});
  return j;
}
const me=()=>tok?tok.split('.')[0]:null;
const pn=id=>{const p=S.cfg&&S.cfg.players.find(x=>x.id===id);return p?esc(p.name):null};
const pn2=(h,x='')=>{const k=h.indexOf('(');return k>0?`<span class="block">${h.slice(0,k).trim()}${x}</span><span class="block text-xs font-semibold opacity-80 mt-0.5">${h.slice(k).trim()}</span>`:h+x};   // prénom sur la 1re ligne, mots entre parenthèses sur la 2e (h = nom déjà échappé)
// Flamme : nombre de matchs « blancs » gagnés depuis le début (adversaire à 0, victoire jouée : ni abandon, ni délai dépassé, ni exemption)
const flN=pid=>{let n=0;for(const m of Object.values(S.matches))if(m.w===pid&&m.a&&m.b&&!m.ff&&!m.ab&&!isBye(m)){const mine=m.w===m.a?m.sa:m.sb,their=m.w===m.a?m.sb:m.sa;if(their===0&&mine>=(m.need||3))n++}return n};
const fl=pid=>{const n=pid?flN(pid):0;return n?`<span class="flex-none" style="margin-left:.3rem;white-space:nowrap" title="${n} match${n>1?'s':''} blanc${n>1?'s':''}"><span class="flm" style="animation-delay:-${(String(pid).split('').reduce((a,ch)=>a+ch.charCodeAt(0),0)%13)/10}s">🔥</span>${n>1?`<b style="font-size:.75em;margin-left:1px;color:#fcd34d">x${n}</b>`:''}</span>`:''};
const raw=id=>{const p=S.cfg&&S.cfg.players.find(x=>x.id===id);return p?p.name:'?'};
const mk=(r,i)=>`m${r}_${i}`;
// Tableau : tous les joueurs jouent dès le tour 1 ; si un tour compte un nombre impair de joueurs, l'un d'eux est « exempté » (il passe directement au tour suivant)
const isBye=m=>!!m&&(!!m.bye||(m.r===0&&!(m.a&&m.b)&&!!m.w));
const cntC=r=>S.cfg.counts?S.cfg.counts[r]:S.cfg.size/2**(r+1);
const routeC=(r,i)=>(cntC(r)%2===1&&(r+1)%2===1)?{t:i===0?0:((i-1)>>1)+1}:{t:i>>1};
const rlabel=r=>{const k=S.cfg.rounds-r;if(k===1)return 'Finale';if(k===2)return 'Demi-finales';if(k===3&&(cntC(r)===4||cntC(r)===3))return 'Quarts de finale';if(k===4&&cntC(r)>=5&&cntC(r)<=8)return 'Huitièmes de finale';return 'Tour '+(r+1)};
const Q_LOSE="« Le vrai maître n'est pas celui qui gagne toujours, mais celui qui sait lire le monde avec patience et simplicité. »";

async function refresh(){
  if(souv){if(!loaded){loaded=true;render()}return}   // mode souvenir : rien à rafraîchir
  if(loaded&&tourOver()&&!inOrga())return;   // tournoi terminé : plus de rafraîchissement automatique (le chargement initial a déjà eu lieu)
  lastRef=Date.now();
  if(tab==='apropos'&&loaded)return;   // « À propos » : contenu fixe, aucun rafraîchissement ni signal de présence (économie de requêtes)
  const f=document.activeElement;
  if(f&&/TEXTAREA|INPUT/.test(f.tagName)&&f.type!=='checkbox'&&f.id!=='pin')return;   // ne pas écraser une saisie en cours
  try{S=await loadState();loadErr=null}catch(e){loadErr=e.message+(e.status?' (HTTP '+e.status+')':'')}

  if(adminKey&&tab==='admin'&&(!adm||Date.now()-lastAdm>=60000)){lastAdm=Date.now();try{adm=await api('admin')}catch(e){if(e.status===401){adminKey='';ls.del('pfc_ak')}}}   // « Orga » : codes, blocages, lots et sondage ne sont relus qu'une fois par minute (c'est l'écran le plus coûteux : ~1 commande par joueur)

const tourOver=()=>{if(!S.cfg||S.cfg.started===false)return false;const fin=S.matches[mk(S.cfg.rounds-1,0)],th=S.matches.third;return !!(fin&&fin.w&&(S.cfg.rounds<2||(th&&th.w)))};

  if(!S.cfg)return false;

  const id=me();if(!id||tab==='admin')return false;
  if(myMatch())return false;
  const lost=Object.values(S.matches).some(m=>m.w&&m.w!==id&&(m.a===id||m.b===id)),fin=S.matches[mk(S.cfg.rounds-1,0)];

// Points sur les 12 derniers mois glissants ; à égalité de points, même rang (ex æquo)
function clCompute(){
  if(!CL)return null;
  const cut=Date.now()-365*864e5,tot={},tn=[];
  for(const t of CL.tournois){
    if(new Date(t.date+'T12:00:00').getTime()<cut)continue;
    const b=CL.bareme[t.type]||{};tn.push(t);
    for(const [n,st] of t.res)tot[n]=(tot[n]||0)+(b[st]||0);
  }
  const l=Object.entries(tot).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fr',{sensitivity:'base'}));
  if(!l.length)return null;
  let r=0;const rows=l.map(([n,p],i)=>{if(i===0||p!==l[i-1][1])r=i+1;return {n,p,r}});
  rows.forEach(x=>x.tie=rows.filter(y=>y.r===x.r).length>1);
  return {rows,tn};
}
function classementView(){
  const c=clCompute();if(!c)return '';
  const fd=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

  const bl=Object.entries(CL.bareme).filter(([k])=>c.tn.some(t=>t.type===k)).map(([k,b])=>`<p class="mt-2"><b>${esc(b.label)}</b> : vainqueur ${b.V} · finaliste ${b.F} · ${(c.tn.filter(t=>t.type===k).every(t=>t.pf===false))?'demi-finale '+b.SF:'3e '+b['3']+' · 4e '+b['4']} · quart de finale ${b.QF} · huitième ${b.R16} · seizième ${b.R32} · premier tour ${b.R1}</p>`).join('');
  return `<details ${aboutOpen.rank?'open':''} ontoggle="aboutOpen.rank=this.open" class="rounded-xl bg-white/10 p-3 mb-3"><summary class="font-bold cursor-pointer">🏅 Classement annuel</summary>
    <p class="mt-3 mb-2 text-sm opacity-90">Les résultats de tous nos tournois rapportent des points, comme sur le circuit de tennis. Seuls les 12 derniers mois comptent.</p>

    <p class="text-xs opacity-80">Tournois pris en compte : ${c.tn.map(t=>esc(t.nom)+' ('+fd(t.date)+')').join(' ; ')}.</p>
    <div class="text-xs opacity-80 mt-1">${bl}</div>
  </details>`;
}

/* ---------- Joueur ---------- */
function myMatch(){
  const id=me();
  return Object.entries(S.matches).map(([k,m])=>({id:k,...m})).filter(m=>(m.a===id||m.b===id)&&m.a&&m.b).sort((x,y)=>x.r-y.r).find(m=>!m.w)||null;
}

// ---- Balle de match : un joueur est à un point de la victoire ----
const BOLT='<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde9a0"/><stop offset="1" stop-color="#f4a62a"/></linearGradient></defs><path d="M13.5 1.5 4.5 13.5h6.2L9.3 22.5l10.2-13h-6.4z" fill="url(#bg)" stroke="#fff3c4" stroke-width=".6" stroke-linejoin="round"/></svg>';
const mpSeen=new Map();   // clé -> instant de première apparition (le fondu ne se rejoue pas à chaque redessin)
function mpAttr(key,base){
  const t=Date.now();if(!mpSeen.has(key))mpSeen.set(key,t);
  const el=t-mpSeen.get(key);
  return el<500?`class="${base} mp-in" style="animation-delay:-${el}ms"`:`class="${base}"`;
}
function mpOf(m){const n=m.need||3;if(m.w||!m.a||!m.b||n<2)return{a:false,b:false};return{a:m.sa===n-1,b:m.sb===n-1}}
const mpName=id=>{const h=raw(id),k=h.indexOf('(');return esc((k>0?h.slice(0,k):h).trim())};
function mpScore(txt,cls,L,R,key){
  const slot=(on,s)=>`<span class="mp-slot">${on?`<span ${mpAttr(key+s,'mp-bolt')}>${BOLT}</span>`:''}</span>`;
  return `<div class="mp-row ${cls}">${slot(L,'L')}<span>${txt}</span>${slot(R,'R')}</div>`;
}
function mpNote(m,key,self){   // self : page « Jouer » — le joueur lit « toi » pour lui-même
  const f=mpOf(m),nm=id=>self&&id===me()?'toi':mpName(id),n=[f.a&&nm(m.a),f.b&&nm(m.b)].filter(Boolean).sort((x,y)=>(y==='toi')-(x==='toi'));
  if(!n.length)return '';
  return `<div ${mpAttr(key+'|'+(f.a?1:0)+(f.b?1:0),'mp-note')}>⚡ Balle de match pour ${n.join(' et ')}</div>`;
}

/* ---------- Confettis du champion ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let cv=document.getElementById('cf');
  if(!cv){cv=document.createElement('canvas');cv.id='cf';cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999';document.body.appendChild(cv)}
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const colors=['#ff3b6b','#ffd23f','#3bceac','#4cc9f0','#b388ff','#ff9f1c','#7cfc00'],P=[];
  const burst=(x,y,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(5+Math.random()*10)*dpr;P.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*v,vy:Math.sin(a)*v-8*dpr,w:(6+Math.random()*6)*dpr,h:(4+Math.random()*5)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],life:0})}};
  burst(W/2,H*.4,170);
  setTimeout(()=>burst(W*.2,H*.5,90),250);
  setTimeout(()=>burst(W*.8,H*.5,90),450);
  cancelAnimationFrame(confRaf);
  const t0=Date.now(),step=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of P){p.vy+=.35*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-p.life/220);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}

let actx=null,sndOn=(()=>{try{return ls.get('pfc_snd')!=='0'}catch(e){return true}})();
function audioCtx(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(sndOn)audioCtx()},{passive:true}));
function winMusic(lose){
  const c=audioCtx();if(!c||!sndOn)return null;
  const K=1.33,t0=c.currentTime+.15,out=c.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(.55,t0+.6);out.connect(c.destination);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(out);
  const dl=c.createDelay(1);dl.delayTime.value=.38;const fb=c.createGain();fb.gain.value=.32;const wet=c.createGain();wet.gain.value=.35;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
  const pluck=(f,t,v,d)=>{const g=c.createGain();t*=K;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v,t0+t+.012);g.gain.exponentialRampToValueAtTime(.0008,t0+t+d);g.connect(lp);
    [['triangle',1,1],['sine',2,.35],['sine',3.01,.12]].forEach(([w,m,a])=>{const o=c.createOscillator(),og=c.createGain();o.type=w;o.frequency.value=f*m;og.gain.value=a;o.connect(og);og.connect(g);o.start(t0+t);o.stop(t0+t+d+.1)})};
  const gong=(f,t,v,d)=>{t*=K;[1,1.51,2.07,2.96].forEach((m,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v/(i+1.4),t0+t+.04);g.gain.exponentialRampToValueAtTime(.0005,t0+t+d/(1+i*.35));o.connect(g);g.connect(lp);o.start(t0+t);o.stop(t0+t+d+.1)})};
  const drone=(f,v)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+2.5);g.gain.linearRampToValueAtTime(0,t0+12.2);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+12.4)};
  const C4=261.63,D4=293.66,E4=329.63,G4=392,A4=440,C5=523.25,D5=587.33,E5=659.25,G5=783.99;
  if(lose==='quit'){
    gong(110,0,.3,5);drone(55,.07);drone(82.41,.04);
    [[1.2,D5],[3.0,A4],[4.9,G4],[6.7,E4]].forEach(([t,f])=>pluck(f,t,.13,2.8));
  }else if(lose==='time'){
    gong(82.41,0,.38,7);drone(55,.08);
    [[1.4,A4],[3.6,E4],[5.6,A4/2]].forEach(([t,f])=>pluck(f,t,.12,3.2));
  }else if(lose){
    gong(98,0,.42,6);drone(55,.09);drone(82.41,.05);
    [[1.1,E5],[2.5,D5],[3.9,C5],[5.3,A4],[6.8,G4]].forEach(([t,f])=>pluck(f,t,.16,2.6));
    [[2.0,A4/2],[4.6,E4],[6.2,C4]].forEach(([t,f])=>pluck(f,t,.1,2.4));
  }else{
  gong(130.81,0,.5,5);drone(65.41,.09);drone(98,.05);
  [[.7,G4],[1.35,A4],[2.0,C5],[2.9,D5],[3.9,E5],[4.6,D5],[5.3,C5],[6.1,A4],[6.8,G4],[7.7,C4*2]].forEach(([t,f],i)=>pluck(f,t,.2,i>8?2.2:1.6));
  [[1.0,C4],[3.4,G4/2],[5.6,A4/2]].forEach(([t,f])=>pluck(f,t,.12,2));
  pluck(G5,4.3,.07,1.8);pluck(E5,6.5,.06,1.8);
  }
  let stopped=false;
  return()=>{if(stopped)return;stopped=true;try{const n=c.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(0,n+.6)}catch(e){}}
}

function pendingOf(key,list){
  let seen=null;try{seen=JSON.parse(ls.get(key)||'null')}catch(e){}
  const ids=list.map(m=>m.id);
  if(!Array.isArray(seen)){ls.set(key,JSON.stringify(ids));return list[0]||null}
  const nw=list.filter(m=>!seen.includes(m.id));
  if(nw.length){ls.set(key,JSON.stringify(ids));return nw[0]}
  return null;
}

function introCheck(){
  const id=me();if(!id||!S.cfg||winShowing)return;
  if(ls.get('pfc_intro')!==null)return;   // une seule fois pour toujours sur cet appareil (après la connexion avec le code)
  ls.set('pfc_intro','1');
  // Un joueur qui a déjà joué (coup, match terminé ou éliminé) a forcément déjà vu l'introduction : on ne la lui remontre pas, même sur un autre appareil
  const played=Object.values(S.matches).some(m=>(m.a===id||m.b===id)&&!isBye(m)&&((m.hist&&m.hist.length)||m.w||(m.pend&&((m.pend.by==='a'&&m.a===id)||(m.pend.by==='b'&&m.b===id)))));
  if(!played)showIntro();

function winCheck(){
  const id=me();if(!id||!S.cfg||S.cfg.started===false||winShowing)return;
  const tid=S.cfg.tid||'',all=Object.entries(S.matches).map(([k,m])=>({...m,id:k}));
  const wins=all.filter(m=>m.w===id&&m.a&&m.b).sort((x,y)=>y.r-x.r);
  const loses=all.filter(m=>m.w&&m.w!==id&&m.a&&m.b&&(m.a===id||m.b===id)&&m.ff!==id).sort((x,y)=>y.r-x.r);
  const ffs=all.filter(m=>m.ff===id&&m.w&&m.w!==id).sort((x,y)=>y.r-x.r);
  const kw='pfc_win_'+tid+'_'+id,kl='pfc_lose_'+tid+'_'+id,kf='pfc_ff_'+tid+'_'+id;
  const first=ls.get(kw)===null&&ls.get(kl)===null&&ls.get(kf)===null;
  if(first){
    /* première ouverture sur cet appareil : on ne montre que l'événement le plus récent */
    ls.set(kw,JSON.stringify(wins.map(m=>m.id)));ls.set(kl,JSON.stringify(loses.map(m=>m.id)));ls.set(kf,JSON.stringify(ffs.map(m=>m.id)));
    if(ffs[0]){showWin(ffs[0],ffs[0].ab===id?'quit':'time');return}
    const a=wins[0],b=loses[0];
    if(a&&(!b||a.r>=b.r)){showWin(a);return}
    if(b){showWin(b,true)}
    return;
  }
  const w=pendingOf(kw,wins);if(w){showWin(w);return}
  const l=pendingOf(kl,loses);if(l){showWin(l,true);return}
  const f=pendingOf(kf,ffs);if(f)showWin(f,f.ab===id?'quit':'time');
}

  // Positions verticales : un match du tour suivant est centré entre ses matchs précédents (les matchs « exemptés » n'ont pas de carte)
  const vis=(r,i)=>{const m=S.matches[mk(r,i)];return !!m};

function aboutView(){

  <div class="rounded-xl bg-yellow-300/20 p-3 mb-3"><p class="font-bold mb-1">⚠️ Rappel important :</p><p>Pour le bon déroulement de l'activité et le respect du cadre de travail, l'ensemble des matchs doit se jouer strictement durant vos temps de pause ou en dehors de vos heures de travail. Merci à chacun d'être vigilant afin de préserver l'organisation et la sécurité de tous.</p></div>
  <div class="rounded-xl bg-rose-400/20 p-3 mb-3"><p class="font-bold mb-1">⏱ Règle des ${S.cfg&&S.cfg.hours||24} heures (week-end exclu)</p><p>Une fois que ton adversaire a joué son coup, tu as ${S.cfg&&S.cfg.hours||24} h pour jouer le tien, sinon tu es éliminé(e) du tournoi. <b>Le week-end ne compte pas</b> : le compte à rebours est arrêté du vendredi soir à minuit jusqu'au lundi matin à 0 h 00, et personne n'est éliminé pendant ce temps. Le compte à rebours qui s'affiche sur ton écran en tient déjà compte. Aucun message de rappel n'est envoyé : pense à passer régulièrement sur l'application !</p></div>
  <details ${aboutOpen.rules?'open':''} ontoggle="aboutOpen.rules=this.open" class="rounded-xl bg-white/10 p-3 mb-3"><summary class="font-bold cursor-pointer">🎮 Comment jouer ?</summary>
    <p class="mt-3 mb-2">Chaque joueur choisit en secret un des trois signes : <b>Pierre</b>, <b>Feuille</b> ou <b>Ciseaux</b>. Les deux signes sont ensuite révélés et le plus fort gagne le tour :</p>
    <ul class="space-y-1 mb-3 text-lg">
      <li>${STONE} <b>Pierre</b> écrase ✂️ <b>Ciseaux</b></li>
      <li>✂️ <b>Ciseaux</b> coupent 📄 <b>Feuille</b></li>
      <li>📄 <b>Feuille</b> enveloppe ${STONE} <b>Pierre</b></li>
    </ul>
    <p class="mb-2">Si les deux joueurs choisissent le même signe, c'est une <b>égalité</b> : on rejoue le tour.</p>
    <p class="mb-2">Un match se gagne en <b>3 victoires</b>, sauf la finale qui se joue en <b>5 victoires</b>.</p>
    <p>Pas besoin d'être connecté en même temps que ton adversaire : une fois ton coup validé, il reste secret et ne peut plus être changé. Il n'est révélé que lorsque ton adversaire a joué le sien.</p>

    <p class="font-bold mt-3 mb-1">1. Des banquets de la Chine antique</p>
    <p class="mb-3">Selon un texte chinois rédigé vers 1600, le jeu remonterait à la dynastie Han (206 av. J.-C. – 220 ap. J.-C.), soit il y a plus de 2 000 ans. Il y est question du Shǒushìlìng (« le jeu des signes de mains »), un jeu de réflexe que l'on dit populaire lors des banquets, où le perdant devait boire un gage.</p>
    <p class="font-bold mb-1">2. L'évolution japonaise et le « Janken »</p>
    <p class="mb-3">Venu de Chine, le jeu arrive au Japon (vers le XVIIᵉ siècle selon plusieurs sources), où l'on pratique de nombreux jeux de poing appelés « sansukumi-ken » : trois signes qui se battent en cercle, comme dans notre jeu. C'est au Japon que ces jeux évoluent vers la version moderne que nous connaissons aujourd'hui : le Janken (avec la Pierre, la Feuille et les Ciseaux). Le mot français Chifoumi vient d'ailleurs très probablement du comptage japonais (Hi-Fu-Mi, 1-2-3) !</p>
    <p class="font-bold mb-1">3. La conquête du monde</p>
    <p>Au XXᵉ siècle, le jeu quitte l'Asie pour l'Occident et se diffuse à travers la planète. Malgré sa simplicité apparente, il est devenu un sujet d'étude en théorie des jeux et en psychologie : car au-delà du hasard, gagner au Chifoumi repose sur l'observation, le rythme et la lecture de son adversaire.</p>
  </details>

  try{await api('removeplayer',{id});S=await loadState();adm=await api('admin')}
  catch(e){alert(e.message==='started'?'Le tournoi est déjà lancé : on ne peut plus effacer de joueur.':e.message==='min2'?'Il faut garder au moins 2 joueurs.':'Erreur : '+e.message)}
  lastSig='';render();
}

}

}

let admSt={key:'',s:''},admTimer=null;
async function adm2(a,id,loser){
  if(a==='forfeit'&&!confirm('Confirmer l\'élimination ? Cette action est définitive.'))return;
  const key=a+':'+id+(loser?':'+loser:'');
  clearTimeout(admTimer);admSt={key,s:'busy'};lastSig='';render();
  try{
    await api(a,{id,loser});
    admSt={key,s:'ok'};lastSig='';
    if(a==='forfeit'){render();await new Promise(r=>setTimeout(r,1100));S=await loadState();admSt={key:'',s:''}}   // le match disparaît de la liste : on laisse voir le « ✓ » une seconde
    else{S=await loadState();render();admTimer=setTimeout(()=>{admSt={key:'',s:''};lastSig='';render()},2000);return}
  }catch(e){admSt={key:'',s:''};alert('Erreur : '+e.message)}
  lastSig='';render();
}
