<style>

body::before{content:"";position:fixed;left:0;right:0;top:0;height:100vh;height:100lvh;z-index:-1;background:linear-gradient(160deg,var(--bg1),var(--bg2));pointer-events:none}   /* dégradé sur toute la plus grande hauteur d'écran possible (barre d'adresse masquée) */
body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:1.25rem}

button{touch-action:manipulation}

@keyframes tdb{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.75)}}
.tdot{display:inline-block;animation:tdb 1.2s ease-in-out infinite}

/* Balle de match : éclair doré qui apparaît en fondu (0,5 s) à côté du score du joueur qui peut gagner d'un point */
.mp-row{display:flex;align-items:center;justify-content:center}
.mp-slot{display:inline-flex;align-items:center;justify-content:center;width:.66em;flex:none}
.mp-bolt{display:inline-flex}
.mp-bolt svg{width:.6em;height:.6em;filter:drop-shadow(0 0 .12em rgba(251,191,36,.6))}
.mp-mini svg{width:1.05em;height:1.05em;margin-right:.15em}

.mp-in{animation:mpf .5s ease-out both}

/* Flamme vivante : vacillement discret (désynchronisé d'un joueur à l'autre) */

@keyframes flm{0%,100%{transform:translateY(0) scale(1,1) rotate(-2deg);filter:brightness(1)}25%{transform:translateY(-1px) scale(1.06,1.14) rotate(2deg);filter:brightness(1.18)}50%{transform:translateY(0) scale(.97,1.03) rotate(-1deg);filter:brightness(1.05)}75%{transform:translateY(-1px) scale(1.04,1.1) rotate(3deg);filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){.flm{animation:none}}
/* Scène d'introduction (première connexion) : objets dessinés à l'encre qui apparaissent un à un */
.in-name{margin-top:10px;font-size:clamp(26px,6.5vw,44px);font-weight:700;letter-spacing:.08em;color:#fcd34d;opacity:0;animation:wfade 1.1s 1.9s forwards}
.in-row{position:absolute;left:0;right:0;top:38%;display:flex;justify-content:center;align-items:flex-start;gap:3vw;padding:0 12px}
.in-o{width:min(29vw,128px);text-align:center;opacity:0;transform:translateY(16px) scale(.9);animation:ino .9s var(--d) cubic-bezier(.2,.8,.3,1.1) forwards;font-family:"Noto Serif","Songti SC",STSong,SimSun,Georgia,serif;color:#fbe7c0}
.in-o svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:inb 3s ease-in-out infinite alternate}

@keyframes ino{to{opacity:1;transform:none}}
@keyframes inb{from{transform:translateY(-2px)}to{transform:translateY(3px)}}

.win-t.in-b{top:67%}
.in-b .win-s{animation-delay:4.4s}
.in-b .win-seal{animation-delay:5.1s}
.win-rm .in-o,.win-rm .in-o svg,.win-rm .in-o .dr,.win-rm .in-o .fl,.win-rm .in-name{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
.win-rm .in-b .win-s,.win-rm .in-b .win-seal{animation-delay:.3s;animation-duration:.6s}
/* Indicateur « il y a une suite en bas » (page Jouer) */
#scrollHint{position:fixed;right:max(14px,calc(50% - 14rem + 10px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;padding:0;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(20,10,35,.72);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s ease}

#topBtn svg{width:1.3rem;height:1.3rem}

@keyframes hnt{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

.pdot{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);margin-right:.35rem;vertical-align:middle;flex:none;box-sizing:border-box}
.pdot.on{border-color:#a7f3d0;background:#34d399;box-shadow:0 0 0 2px rgba(52,211,153,.30),0 0 8px rgba(52,211,153,.9);animation:pdp 2.4s ease-in-out infinite}

.sym{display:flex;align-items:center;justify-content:center;height:3.6rem;line-height:1}
.rv{padding:1rem .75rem 1.15rem;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.rv-l,.rv-v,.rv-t{text-shadow:0 1px 3px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.25)}   /* fine ombre derrière les lettres */
.rv-l{font-size:.85rem;opacity:.78}
.rv-v{font-size:2.5rem;line-height:1.2;margin:.15rem 0 .25rem}
.rv-v b{font-size:2.5rem;font-weight:800;margin:0 .3rem}
.rv-t{font-size:1.35rem;font-weight:700}
/* historique : plaques de bois + symboles dorés */
.hg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:.9rem}
.hr{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:14px;border:2px solid #1c0f07;
background:var(--h1,linear-gradient(transparent,transparent)),var(--h2,linear-gradient(transparent,transparent)),repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px),linear-gradient(180deg,#5a3a24,#3a2314 55%,#2c1a0d);
box-shadow:inset 0 2px 3px rgba(255,210,150,.22),inset 0 -3px 5px rgba(0,0,0,.55),0 3px 6px rgba(0,0,0,.4)}
.hn{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.35rem;min-width:1.5rem;
background:linear-gradient(180deg,#f6e7b0,#d9b45f 55%,#a9803a);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 1px 1px rgba(0,0,0,.8))}
.hs{display:flex;gap:2px;flex:1;justify-content:center}
.hs svg{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
/* halos spectateur : vert = gagnant, rouge = perdant, gris = égalité (doux) */
.hr{--gv:radial-gradient(ellipse 60% 120% at 50% 50%,rgba(95,200,125,.30),transparent 75%);--rg:radial-gradient(ellipse 60% 120% at 50% 50%,rgba(225,95,95,.27),transparent 75%)}
.hr.wa{--h1:radial-gradient(ellipse 48% 130% at 22% 50%,rgba(80,215,125,.40),transparent 80%);--h2:radial-gradient(ellipse 48% 130% at 78% 50%,rgba(235,90,90,.36),transparent 80%)}
.hr.wb{--h1:radial-gradient(ellipse 48% 130% at 22% 50%,rgba(235,90,90,.36),transparent 80%);--h2:radial-gradient(ellipse 48% 130% at 78% 50%,rgba(80,215,125,.40),transparent 80%)}
.hr.tt{--h1:radial-gradient(ellipse 85% 140% at 50% 50%,rgba(210,210,220,.24),transparent 85%)}
/* symboles « vivants » du dernier tour joué : Pierre saute, Feuille ondule, Ciseaux s'ouvrent et se ferment */
.hop{animation:hopy 1.3s ease-in-out infinite;transform-origin:50% 100%}
/* duel du dernier tour : les deux symboles foncent l'un sur l'autre, s'affrontent, puis reprennent leur place (un duel de ~4,6 s toutes les 9 s ; entre deux duels, les symboles bougent sur place) */
.hr.top{container-type:inline-size;--dx:calc(25cqw + 2px)}
.fgL{--s:1}.fgR{--s:-1}.fw{z-index:2}
.fgo{animation:fgo 9s infinite}
@keyframes fgo{0.0%,13.3%{transform:translateX(0);animation-timing-function:cubic-bezier(.55,0,.9,.5)}20.4%{transform:translateX(calc(var(--dx)*var(--s)))}36.8%{transform:translateX(calc(var(--dx)*var(--s)));animation-timing-function:ease-in-out}45.0%,100%{transform:translateX(0)}}
.fgt{animation:fgt 9s infinite}
@keyframes fgt{0.0%,13.3%{transform:translateX(0) rotate(0);animation-timing-function:cubic-bezier(.55,0,.9,.5)}20.4%{transform:translateX(calc(var(--dx)*var(--s))) rotate(calc(9deg*var(--s)));animation-timing-function:ease-out}24.1%{transform:translateX(calc(var(--dx)*var(--s) - 24px*var(--s))) rotate(calc(-6deg*var(--s)))}27.6%{transform:translateX(calc(var(--dx)*var(--s) - 6px*var(--s))) rotate(calc(3deg*var(--s)));animation-timing-function:ease-in-out}35.8%,100%{transform:translateX(0) rotate(0)}}
.fxcr{animation:fxcr 9s infinite;transform-origin:50% 100%}
@keyframes fxcr{0.0%,20.4%{transform:scale(1,1)}23.5%{transform:scale(1.45,.2)}36.8%{transform:scale(1.45,.2)}44.0%,100%{transform:scale(1,1)}}
.fxww{animation:fxww 9s infinite;transform-origin:50% 55%}
@keyframes fxww{0.0%,20.4%{transform:scale(1) translateX(0);clip-path:ellipse(75% 75% at 50% 50%)}26.5%{transform:scale(1.7,1.6) translateX(calc(21px*var(--s)));clip-path:ellipse(47% 50% at 50% 50%)}29.1%{transform:scale(1.45,1.7) translateX(calc(21px*var(--s)))}31.7%{transform:scale(1.75,1.5) translateX(calc(21px*var(--s)))}34.2%{transform:scale(1.5,1.65) translateX(calc(21px*var(--s)))}36.8%{transform:scale(1.7,1.6) translateX(calc(21px*var(--s)));clip-path:ellipse(47% 50% at 50% 50%)}44.0%,100%{transform:scale(1) translateX(0);clip-path:ellipse(75% 75% at 50% 50%)}}
.fxwl{animation:fxwl 9s infinite}
@keyframes fxwl{0.0%,20.4%{transform:scale(1);opacity:1}26.5%{transform:scale(.6);opacity:.55}36.8%{transform:scale(.6);opacity:.55}44.0%,100%{transform:scale(1);opacity:1}}
.fl{z-index:3}
.two{display:inline-grid;width:38px;height:38px;transform-origin:50% 92%}
.two svg{grid-area:1/1}
.hA{clip-path:inset(0 50% 0 0);animation:cutA 9s infinite;transform-origin:50% 100%}
.hB{clip-path:inset(0 0 0 50%);animation:cutB 9s infinite;transform-origin:50% 100%}
@keyframes cutA{0.0%,21.5%{transform:none}25.5%{transform:translateX(-11px) rotate(-16deg)}36.8%{transform:translateX(-11px) rotate(-16deg)}44.0%,100%{transform:none}}
@keyframes cutB{0.0%,21.5%{transform:none}25.5%{transform:translateX(11px) rotate(16deg)}36.8%{transform:translateX(11px) rotate(16deg)}44.0%,100%{transform:none}}

/* symbole sélectionné : il grossit au rythme de battements de cœur (deux pulsations puis un repos) */

/* grand trophée qui brille au-dessus de la finale */
.trophy{display:flex;align-items:center;justify-content:center;pointer-events:none}

@keyframes flgw{0%,100%{transform:rotate(-7deg) skewY(0) translateY(0)}25%{transform:rotate(4deg) skewY(-6deg) translateY(-1.5px)}50%{transform:rotate(9deg) skewY(2deg) translateY(0)}75%{transform:rotate(-2deg) skewY(6deg) translateY(-1px)}}

@keyframes hopy{0%,55%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-7px) scale(.96,1.05)}45%{transform:translateY(0) scale(1.06,.93)}}

.hg.one{grid-template-columns:1fr;gap:8px}

</defs></svg><div id="shell" class="mx-auto p-3" style="max-width:28rem"><h1 id="ttl" class="text-center text-2xl font-black py-2"></h1><div id="app"></div></div>
<script>
const STONE='<svg viewBox="2 7 60 52" width="1.3em" height="1.13em" style="display:inline-block;vertical-align:-.2em" aria-label="Pierre"><path d="M9 45C5 34 11 22 21 18C27 11 40 11 46 18C56 22 61 34 56 45C54 53 44 55 32 55C20 55 11 53 9 45Z" fill="#9ca3af" stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/><path d="M10 45C12 51 20 55 32 55C44 55 54 52 56 45C50 49 40 50 31 49C21 48 14 47 10 45Z" fill="#6b7280"/><path d="M19 27C23 20 31 18 38 19C32 21 27 24 25 31Z" fill="#e5e7eb"/><path d="M40 25L35 34L42 39" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const E={r:STONE,f:'📄',c:'✂️'},N={r:'Pierre',f:'Feuille',c:'Ciseaux'};
const $=s=>document.querySelector(s);
const emo=e=>`<span class="emo">${esc(e||'🎵')}</span>`;   // emoji de thème posé sur une pastille claire : bien visible même quand l'emoji est sombre (notes de musique, etc.)
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S={cfg:null,matches:{}},tok=ls.get('bt_tok'),adminKey=ls.get('bt_ak')||'',adm=null,tab='jeu',sel=null,lg={id:null,pin:'',err:false},remember=true,busy=false,prevTurn=null,loaded=false,confirmReset=false,loadErr=null,lastSig='',popKey='',bigBoard=false,skew=0,watch=null,confSig='',confRaf=null,aboutOpen={rules:true,hist:false,rank:true,master:false},clMode='g',souv=false,CL=null,clAll=false,jeuScroll=true;   // souv : mode « souvenir » (tableau figé lu dans souvenir.json, aucun appel au serveur)
$('#ttl').innerHTML='<div>🎧 🎵 🎤</div><div class="text-lg mt-1">Master Blind Test — Édition RSP 2026</div>';

async function api(action,extra){
  if(souv)throw Object.assign(new Error('souvenir'),{status:0});
  const r=await fetch('/api/bt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:tok,key:adminKey,...extra})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'erreur'),{status:r.status,data:j});
  return j;
}
const me=()=>tok?tok.split('.')[0]:null;
const pn=id=>{const p=S.cfg&&S.cfg.players.find(x=>x.id===id);return p?esc(p.name):null};
const pn2=(h,x='')=>{const k=h.indexOf('(');return k>0?`<span class="block">${h.slice(0,k).trim()}${x}</span><span class="block text-xs font-semibold opacity-80 mt-0.5">${h.slice(k).trim()}</span>`:h+x};   // prénom sur la 1re ligne, mots entre parenthèses sur la 2e (h = nom déjà échappé)
// Flamme : nombre de matchs gagnés avec au moins 7 bonnes réponses sur 9 (victoire jouée : ni abandon, ni délai dépassé, ni exemption)
const flN=pid=>{let n=0;for(const m of Object.values(S.matches))if(m.w===pid&&m.a&&m.b&&!m.ff&&!m.ab&&!isBye(m)){if(sums(m,m.w===m.a?'a':'b').ok>=7)n++}return n};
const fl=pid=>{const n=pid?flN(pid):0;return n?`<span class="flex-none" style="margin-left:.3rem;white-space:nowrap" title="${n} match${n>1?'s':''} gagné${n>1?'s':''} avec au moins 7 bonnes réponses sur 9"><span class="flm" style="animation-delay:-${(String(pid).split('').reduce((a,ch)=>a+ch.charCodeAt(0),0)%13)/10}s">🔥</span>${n>1?`<b style="font-size:.75em;margin-left:1px;color:#fcd34d">x${n}</b>`:''}</span>`:''};
const raw=id=>{const p=S.cfg&&S.cfg.players.find(x=>x.id===id);return p?p.name:'?'};
const mk=(r,i)=>`m${r}_${i}`;
// ---- Blind test : étapes d'un match (même logique que le serveur) ----
const oth=s=>s==='a'?'b':'a';
// Difficulté progressive : 1 = premiers tours, 2 = quarts et demi-finales, 3 = finale et petite finale
const lvlC=m=>(m.id==='third'||m.r>=S.cfg.rounds-1?3:m.r>=S.cfg.rounds-3?2:1);
const lvlTxt=m=>{const l=lvlC(m),c=S.cfg;return l===3?`saisie avec suggestions · ${c.L3||15} s`:l===2?`6 choix · ${c.L2||12} s`:`4 choix · ${c.L||10} s`};
const normC=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const SEQ=f=>[[f,0],[oth(f),0],[oth(f),1],[f,1],[f,2],[oth(f),2]];
const pickerOf=(f,k)=>k===1?oth(f):f;
function stepC(m){if(!m||!m.f)return null;for(const [s,k] of SEQ(m.f)){const R=(m.R||[])[k];if(!R||!R.th||R.A[s].length<3)return {s,k}}return 'done'}
const rDone=(m,s,k)=>{const R=(m.R||[])[k];return !!R&&R.A[s].length>=3};
// Ce que le spectateur (ou le joueur) a le droit de voir : un joueur ne voit les résultats de son adversaire sur une manche qu'après l'avoir jouée lui-même
function seeOpp(m,k){const id=me();if(!id||m.w||(m.a!==id&&m.b!==id))return true;const sd=m.a===id?'a':'b';return rDone(m,sd,k)}
function sums(m,s,masked){let p=0,t=0,ok=0;(m.R||[]).forEach((R,k)=>{if(masked&&!seeOpp(m,k))return;for(const x of R.A[s]){p+=x.p;t+=x.t;ok+=x.ok}});return {p,t,ok}}
const ptsV=(m,s)=>{const id=me(),mine=id&&(m[s]===id);return sums(m,s,!mine).p};   // score affiché : masqué pour l'adversaire tant que la manche n'est pas jouée par le joueur qui regarde
// Tableau : tous les joueurs jouent dès le tour 1 ; si un tour compte un nombre impair de joueurs, l'un d'eux est « exempté » (il passe directement au tour suivant)
const isBye=m=>!!m&&(!!m.bye||(m.r===0&&!(m.a&&m.b)&&!!m.w));
const cntC=r=>S.cfg.counts?S.cfg.counts[r]:S.cfg.size/2**(r+1);
const routeC=(r,i)=>(cntC(r)%2===1&&(r+1)%2===1)?{t:i===0?0:((i-1)>>1)+1}:{t:i>>1};
const rlabel=r=>{const k=S.cfg.rounds-r;if(k===1)return 'Finale';if(k===2)return 'Demi-finales';if(k===3&&(cntC(r)===4||cntC(r)===3))return 'Quarts de finale';if(k===4&&cntC(r)>=5&&cntC(r)<=8)return 'Huitièmes de finale';return 'Tour '+(r+1)};
const Q_LOSE="« Le vrai maître n'est pas celui qui gagne toujours, mais celui qui sait lire le monde avec patience et simplicité. »";
const Q_THIRD="« La victoire est belle, mais la plus grande richesse reste le chemin parcouru ensemble et le rire partagé. »";
const Q_FALL="« La plus grande gloire n'est pas de ne jamais tomber, mais de se relever à chaque chute. » (Confucius)";
const Q_SEED="« Toutes les fleurs de l'avenir sont dans les semences d'aujourd'hui. » (Proverbe chinois)";
const quoteP=q=>`<p class="text-center italic mt-4 text-lg leading-relaxed">${q}</p>`;
const CAL=`<svg viewBox="0 0 24 24" width="1.15em" height="1.15em" style="display:inline-block;vertical-align:-.2em" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="#fff"/><path d="M3 8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v3H3z" fill="#ef4444"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="#6b7280"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="#6b7280"/><g fill="#cbd5e1"><rect x="6.5" y="13" width="3" height="2.4" rx=".6"/><rect x="10.5" y="13" width="3" height="2.4" rx=".6"/><rect x="14.5" y="13" width="3" height="2.4" rx=".6"/><rect x="6.5" y="16.7" width="3" height="2.4" rx=".6"/><rect x="10.5" y="16.7" width="3" height="2.4" rx=".6"/></g></svg>`;
const fmtWhen=ms=>new Date(ms).toLocaleString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const toInput=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16);
const mlabel=m=>m.id==='third'?'Petite finale (3e place)':rlabel(m.r);
const wrap=h=>`<div class="card p-4 mb-3">${h}</div>`;
const now=()=>Date.now()+skew;
function norm(j){if(j&&j.now){skew=j.now-Date.now();delete j.now}if(j&&!j.on&&S&&S.on)j.on=S.on;return j}   // « on » : joueurs en ligne (reçu seulement à chaque signal de présence)
let hid=ls.get('bt_hid')==='1',lastPing=0,lastAdm=0;   // hid : « Apparaître hors ligne »
const isOn=id=>!!id&&!!S.on&&S.on.includes(id);
const pdot=id=>`<span class="pdot${isOn(id)?' on':''}"></span>`;
const presTxt=id=>`<span class="pdot${isOn(id)?' on':''}"></span>${isOn(id)?'En ligne':'Hors ligne'}`;
function toggleHid(){hid=!hid;ls.set('bt_hid',hid?'1':'0');lastPing=0;lastSig='';render();refresh()}
const loadState=async()=>{const ping=Date.now()-lastPing>=18000;if(ping)lastPing=Date.now();return norm(await api('state',ping?{ping:true,hid}:{}))};
const cd=ms=>{if(ms<=0)return 'délai dépassé';const h=Math.floor(ms/3.6e6),mn=Math.floor(ms%3.6e6/6e4);return h+' h '+String(mn).padStart(2,'0')};
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(el=>{const d=+el.dataset.cd-now();el.textContent=cd(d);if(d<=0&&!document.hidden&&!idle())refresh()}),30000);

// Déconnecte automatiquement si le tournoi a été réinitialisé (jeton d'un ancien tournoi)
function checkSession(){if(tok&&S.cfg&&(tok.split('.')[1]!==(S.cfg.tid||'')||!pn(me()))){tok=null;ls.del('bt_tok')}}
async function refresh(){
  if(souv){if(!loaded){loaded=true;render()}return}   // mode souvenir : rien à rafraîchir
  if(qz&&loaded)return;   // extrait en cours : on ne touche pas à l'écran
  if(loaded&&tourOver()&&!inOrga())return;   // tournoi terminé : plus de rafraîchissement automatique (le chargement initial a déjà eu lieu)
  lastRef=Date.now();
  if(tab==='apropos'&&loaded)return;   // « À propos » : contenu fixe, aucun rafraîchissement ni signal de présence (économie de requêtes)
  const f=document.activeElement;
  if(f&&/TEXTAREA|INPUT/.test(f.tagName)&&f.type!=='checkbox'&&f.id!=='pin')return;   // ne pas écraser une saisie en cours
  try{S=await loadState();loadErr=null}catch(e){loadErr=e.message+(e.status?' (HTTP '+e.status+')':'')}
  loaded=true;
  if(adminKey&&tab==='admin'&&(!adm||Date.now()-lastAdm>=60000)){lastAdm=Date.now();try{adm=await api('admin')}catch(e){if(e.status===401){adminKey='';ls.del('bt_ak')}}}   // « Orga » : codes, blocages, lots et sondage ne sont relus qu'une fois par minute (c'est l'écran le plus coûteux : ~1 commande par joueur)
  checkSession();
  const sig=JSON.stringify([S,loadErr,adm,tok,loaded]);
  if(sig===lastSig)return;   // rien n'a changé : on ne redessine pas

function clCompute(mode){
  if(!CL)return null;
  // mode 'g' : classement général, 12 mois glissants (comme le classement ATP) ; mode 's' : « course » de la saison = année civile (repart de zéro chaque 1er janvier), Master Final compris ; mode 'q' : course avant le Master Final (sert à désigner les 8 qualifiés)
  const yr=CL.saison||new Date().getFullYear(),cut=Date.now()-365*864e5,tot={},tn=[],per={};
  for(const t of CL.tournois){
    const d=new Date(t.date+'T12:00:00');
    if(mode==='s'||mode==='q'){if(d.getFullYear()!==yr||(mode==='q'&&t.type==='master'))continue}
    else if(d.getTime()<cut)continue;
    const b=CL.bareme[t.type]||{},ti=tn.length;tn.push(t);
    for(const [n,st] of t.res){tot[n]=(tot[n]||0)+(b[st]||0);(per[n]=per[n]||{})[ti]=b[st]||0}
  }
  // Course : à égalité de points, on compare les points marqués dans le plus gros tournoi (Grand Chelem, puis Master, tournoi moyen, petits tournois), puis dans le suivant, etc.
  const order=tn.map((t,i)=>i).sort((a,b)=>((CL.bareme[tn[b].type]||{}).V||0)-((CL.bareme[tn[a].type]||{}).V||0)||(tn[a].date<tn[b].date?-1:tn[a].date>tn[b].date?1:0));
  const key=n=>order.map(i=>(per[n]||{})[i]||0),cmpK=(a,b)=>{const x=key(a),y=key(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return y[i]-x[i];return 0};
  const l=Object.entries(tot).sort((a,b)=>b[1]-a[1]||(mode!=='g'?cmpK(a[0],b[0]):0)||a[0].localeCompare(b[0],'fr',{sensitivity:'base'}));
  if(!l.length)return mode!=='g'?{rows:[],tn,yr}:null;
  let r=0;const rows=l.map(([n,p],i)=>{if(i===0||p!==l[i-1][1]||(mode!=='g'&&cmpK(n,l[i-1][0])!==0))r=i+1;return {n,p,r}});
  rows.forEach(x=>x.tie=rows.filter(y=>y.r===x.r).length>1);
  // variation depuis le dernier tournoi joué (+ gagnés ; − aussi quand des points de plus d'un an sortent du classement général)
  const last=mode==='q'?null:tn.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)[0];
  if(last){
    const T=new Date(last.date+'T12:00:00').getTime(),pt={};
    for(const t of CL.tournois){
      if(t===last)continue;
      const d=new Date(t.date+'T12:00:00');
      if(mode==='s'){if(d.getFullYear()!==yr)continue}else if(d.getTime()<T-365*864e5||d.getTime()>T)continue;
      const b=CL.bareme[t.type]||{};
      for(const [n,st] of t.res)pt[n]=(pt[n]||0)+(b[st]||0);
    }
    rows.forEach(x=>x.d=x.p-(pt[x.n]||0));
    // places avant ce dernier tournoi (pour les flèches ▲▼) ; pas de flèches s'il n'y a eu aucun tournoi avant
    const pl=Object.entries(pt).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]),pr={};
    pl.forEach(([n,p],i)=>{pr[n]=(i&&p===pl[i-1][1])?pr[pl[i-1][0]]:i+1});
    if(pl.length)rows.forEach(x=>x.m=pr[x.n]==null?'new':pr[x.n]-x.r);
  }
  if(mode==='s'){const qs=new Set(clCompute('q').rows.filter(x=>x.r<=8).map(x=>x.n));rows.forEach(x=>x.q=qs.has(x.n))}
  return {rows,tn,yr,last};
}

function softScroll(to){
  cancelAnimationFrame(softRaf);

  if(Math.abs(d)<4)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){window.scrollTo(0,dest);return}
  const dur=Math.min(3600,Math.max(1600,Math.abs(d)*2.9)),t0=performance.now();   // lent : environ 3 s pour 800 px
  const ease=t=>-(Math.cos(Math.PI*t)-1)/2;   // sinus : montée et descente de vitesse très progressives
  const stop=()=>{cancelAnimationFrame(softRaf);['wheel','touchstart','keydown','mousedown'].forEach(e=>window.removeEventListener(e,stop))};

  const step=now=>{const k=Math.min(1,(now-t0)/dur);window.scrollTo(0,from+d*ease(k));if(k<1)softRaf=requestAnimationFrame(step);else stop()};
  softRaf=requestAnimationFrame(step);

// Récapitulatif des 3 manches (pastilles vertes = trouvé, rouges = raté, grises = pas encore joué ou caché)
function roundsTable(m,L1,L2,n1,n2){
  const f=m.f;
  const dots=(R,s,k)=>{const show=s===L1&&me()&&m[s]===me()?true:seeOpp(m,k);return [0,1,2].map(j=>{const x=R&&R.A[s][j];return `<span class="qd ${x?(show?(x.ok?'ok':'ko'):'hid'):''}"></span>`}).join('')};
  const pts=(R,s,k)=>{const show=s===L1&&me()&&m[s]===me()?true:seeOpp(m,k);if(!R||!R.A[s].length)return '';return show?R.A[s].reduce((a,x)=>a+x.p,0):'?'};
  const rows=[0,1,2].map(k=>{const R=(m.R||[])[k],who=f?(pickerOf(f,k)===L1?n1:n2):'';const lab=R&&R.th?`${emo(R.th.emoji)} ${esc(R.th.name)}`:(f?`à choisir par ${who==='Toi'?'toi':who}`:'à choisir');
    return `<div class="rounded-2xl bg-white/10 px-3 py-2 flex items-center justify-between gap-2"><div style="min-width:5.5rem"><div>${dots(R,L1,k)}</div><div class="text-xs opacity-80">${pts(R,L1,k)}</div></div><div class="text-center text-sm leading-tight flex-1"><div class="text-xs opacity-70">Manche ${k+1}</div>${lab}</div><div class="text-right" style="min-width:5.5rem"><div>${dots(R,L2,k)}</div><div class="text-xs opacity-80">${pts(R,L2,k)}</div></div></div>`}).join('');
  return `<div id="histHead" class="mt-5"><div class="flex justify-between text-xs font-bold opacity-90 mb-1 px-1"><span>${n1}</span><span class="truncate" style="max-width:50%">${n2}</span></div><div class="space-y-2">${rows}</div></div>`;
}

/* musique de victoire : synthèse Web Audio (cithare pentatonique + gong doux), aucun fichier audio */
let actx=null,sndOn=(()=>{try{return ls.get('bt_snd')!=='0'}catch(e){return true}})();
function audioCtx(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(sndOn)audioCtx()},{passive:true}));
function winMusic(lose){
  const c=audioCtx();if(!c||!sndOn)return null;
  const K=1.33,t0=c.currentTime+.15,out=c.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(.55,t0+.6);out.connect(c.destination);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(out);
  const dl=c.createDelay(1);dl.delayTime.value=.38;const fb=c.createGain();fb.gain.value=.32;const wet=c.createGain();wet.gain.value=.35;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
  const pluck=(f,t,v,d)=>{const g=c.createGain();t*=K;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v,t0+t+.012);g.gain.exponentialRampToValueAtTime(.0008,t0+t+d);g.connect(lp);
    [['triangle',1,1],['sine',2,.35],['sine',3.01,.12]].forEach(([w,m,a])=>{const o=c.createOscillator(),og=c.createGain();o.type=w;o.frequency.value=f*m;og.gain.value=a;o.connect(og);og.connect(g);o.start(t0+t);o.stop(t0+t+d+.1)})};
  const gong=(f,t,v,d)=>{t*=K;[1,1.51,2.07,2.96].forEach((m,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v/(i+1.4),t0+t+.04);g.gain.exponentialRampToValueAtTime(.0005,t0+t+d/(1+i*.35));o.connect(g);g.connect(lp);o.start(t0+t);o.stop(t0+t+d+.1)})};
  const drone=(f,v)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+2.5);g.gain.linearRampToValueAtTime(0,t0+12.2);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+12.4)};
  const C4=261.63,D4=293.66,E4=329.63,G4=392,A4=440,C5=523.25,D5=587.33,E5=659.25,G5=783.99;
  if(lose==='quit'){
    gong(110,0,.3,5);drone(55,.07);drone(82.41,.04);
    [[1.2,D5],[3.0,A4],[4.9,G4],[6.7,E4]].forEach(([t,f])=>pluck(f,t,.13,2.8));
  }else if(lose==='time'){
    gong(82.41,0,.38,7);drone(55,.08);
    [[1.4,A4],[3.6,E4],[5.6,A4/2]].forEach(([t,f])=>pluck(f,t,.12,3.2));
  }else if(lose){
    gong(98,0,.42,6);drone(55,.09);drone(82.41,.05);
    [[1.1,E5],[2.5,D5],[3.9,C5],[5.3,A4],[6.8,G4]].forEach(([t,f])=>pluck(f,t,.16,2.6));
    [[2.0,A4/2],[4.6,E4],[6.2,C4]].forEach(([t,f])=>pluck(f,t,.1,2.4));
  }else{
  gong(130.81,0,.5,5);drone(65.41,.09);drone(98,.05);
  [[.7,G4],[1.35,A4],[2.0,C5],[2.9,D5],[3.9,E5],[4.6,D5],[5.3,C5],[6.1,A4],[6.8,G4],[7.7,C4*2]].forEach(([t,f],i)=>pluck(f,t,.2,i>8?2.2:1.6));
  [[1.0,C4],[3.4,G4/2],[5.6,A4/2]].forEach(([t,f])=>pluck(f,t,.12,2));
  pluck(G5,4.3,.07,1.8);pluck(E5,6.5,.06,1.8);
  }
  let stopped=false;
  return()=>{if(stopped)return;stopped=true;try{const n=c.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(0,n+.6)}catch(e){}}
}

}
function pendingOf(key,list){
  let seen=null;try{seen=JSON.parse(ls.get(key)||'null')}catch(e){}
  const ids=list.map(m=>m.id);
  if(!Array.isArray(seen)){ls.set(key,JSON.stringify(ids));return list[0]||null}
  const nw=list.filter(m=>!seen.includes(m.id));
  if(nw.length){ls.set(key,JSON.stringify(ids));return nw[0]}
  return null;
}

// Petit jingle de bienvenue (synthèse Web Audio, aucun fichier) : arpège montant façon jeu télévisé + accord final
function introJingle(){
  const c=audioCtx();if(!c||!sndOn)return null;
  const t0=c.currentTime+.45,out=c.createGain();out.gain.value=.5;out.connect(c.destination);
  const tone=(f,t,d,v,type)=>{const o=c.createOscillator(),g=c.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(v,t0+t+.015);g.gain.exponentialRampToValueAtTime(.0008,t0+t+d);o.connect(g);g.connect(out);o.start(t0+t);o.stop(t0+t+d+.05)};
  const kick=t=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(150,t0+t);o.frequency.exponentialRampToValueAtTime(45,t0+t+.18);g.gain.setValueAtTime(.55,t0+t);g.gain.exponentialRampToValueAtTime(.001,t0+t+.22);o.connect(g);g.connect(out);o.start(t0+t);o.stop(t0+t+.25)};
  [[0,523.25],[.12,659.25],[.24,783.99],[.36,1046.5],[.6,783.99],[.72,1046.5]].forEach(([t,f])=>{tone(f,t,.22,.16);tone(f/2,t,.18,.05,'square')});
  [523.25,659.25,783.99,1046.5].forEach(f=>tone(f,.98,1.6,.11));tone(261.63,.98,1.8,.09,'square');
  [0,.36,.72,.98].forEach(kick);
  let stopped=false;
  return()=>{if(stopped)return;stopped=true;try{const n=c.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(0,n+.4)}catch(e){}};
}

function discCheck(){if(souv||winShowing||!loaded)return;if(ls.get('bt_disc')!==null)return;showDisc()}
function introCheck(){
  const id=me();if(!id||!S.cfg||winShowing)return;
  if(ls.get('bt_intro')!==null)return;   // une seule fois pour toujours sur cet appareil (après la connexion avec le code)
  ls.set('bt_intro','1');
  // Un joueur qui a déjà joué (coup, match terminé ou éliminé) a forcément déjà vu l'introduction : on ne la lui remontre pas, même sur un autre appareil
  const played=Object.values(S.matches).some(m=>(m.a===id||m.b===id)&&!isBye(m)&&(m.w||(m.R||[]).some(R=>R.A[m.a===id?'a':'b'].length)));
  if(!played)showIntro();
}
function winCheck(){
  const id=me();if(!id||!S.cfg||S.cfg.started===false||winShowing)return;
  const tid=S.cfg.tid||'',all=Object.entries(S.matches).map(([k,m])=>({...m,id:k}));
  const wins=all.filter(m=>m.w===id&&m.a&&m.b).sort((x,y)=>y.r-x.r);
  const loses=all.filter(m=>m.w&&m.w!==id&&m.a&&m.b&&(m.a===id||m.b===id)&&m.ff!==id).sort((x,y)=>y.r-x.r);
  const ffs=all.filter(m=>m.ff===id&&m.w&&m.w!==id).sort((x,y)=>y.r-x.r);
  const kw='bt_win_'+tid+'_'+id,kl='bt_lose_'+tid+'_'+id,kf='bt_ff_'+tid+'_'+id;
  const first=ls.get(kw)===null&&ls.get(kl)===null&&ls.get(kf)===null;
  if(first){
    /* première ouverture sur cet appareil : on ne montre que l'événement le plus récent */
    ls.set(kw,JSON.stringify(wins.map(m=>m.id)));ls.set(kl,JSON.stringify(loses.map(m=>m.id)));ls.set(kf,JSON.stringify(ffs.map(m=>m.id)));
    if(ffs[0]){showWin(ffs[0],ffs[0].ab===id?'quit':'time');return}
    const a=wins[0],b=loses[0];
    if(a&&(!b||a.r>=b.r)){showWin(a);return}
    if(b){showWin(b,true)}
    return;
  }
  const w=pendingOf(kw,wins);if(w){showWin(w);return}
  const l=pendingOf(kl,loses);if(l){showWin(l,true);return}
  const f=pendingOf(kf,ffs);if(f)showWin(f,f.ab===id?'quit':'time');
}

  const R=S.cfg.rounds,fin=S.matches[mk(R-1,0)],th=S.matches.third,id=me(),pw=x=>x&&x!=='none'?pn(x):'—';

// Symbole de l'historique ; sur la ligne la plus récente (anim), il est animé
function sym(v,anim,dl,fx){

  if(!anim)return `<svg viewBox="0 0 40 40"><use href="#g-${v}"/></svg>`;
  if(fx==='cut')return `<span class="two wav" ${st}><svg viewBox="0 0 40 40" class="hA"><use href="#g-${v}"/></svg><svg viewBox="0 0 40 40" class="hB"><use href="#g-${v}"/></svg></span>`;
  if(v==='c')return `<svg viewBox="0 0 40 40" fill="none" stroke="url(#gold)" stroke-linecap="round"${fx==='crush'?' class="fxcr"':''}><g class="snA" ${st}><path d="M16 5L29 31" stroke-width="4"/><circle cx="32" cy="33" r="5" stroke-width="3"/></g><g class="snB" ${st}><path d="M32 5L19 31" stroke-width="4"/><circle cx="16" cy="33" r="5" stroke-width="3"/></g></svg>`;
  const idle=v==='r'?'hop':'wav',svg=`<svg viewBox="0 0 40 40" class="${idle}" ${st}><use href="#g-${v}"/></svg>`;
  if(fx==='wrapW'||fx==='wrapL')return `<span class="${fx==='wrapW'?'fxww':'fxwl'}" style="display:flex">${svg}</span>`;

}

function duel(l,r){

async function removeP(id){
  const p=S.cfg.players.find(x=>x.id===id);if(!p)return;
  if(regOpen()){if(!confirm('Retirer '+p.name+' des inscrits ?'))return}
  else{if(S.cfg.players.length<=2){alert('Il faut garder au moins 2 joueurs.');return}
  if(!confirm('Effacer '+p.name+' du tournoi ? Le tirage au sort sera refait avec les joueurs restants (les codes des autres joueurs ne changent pas).'))return}
  try{await api('removeplayer',{id});S=await loadState();adm=await api('admin')}
  catch(e){alert(e.message==='started'?'Le tournoi est déjà lancé : on ne peut plus effacer de joueur.':e.message==='min2'?'Il faut garder au moins 2 joueurs.':'Erreur : '+e.message)}
  lastSig='';render();
}
async function saveStart(clear){
  const v=$('#startAt').value;
  if(!clear&&!v){alert('Choisis une date et une heure.');return}
  try{await api('schedule',{at:clear?null:new Date(v).getTime()});S=await loadState()}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function addPlayers(){
  const t=$('#newNames').value;
  if(!t.trim()){alert('Entre au moins un prénom.');return}
  if(!regOpen()&&!confirm('Ajouter ces joueurs ? Le tirage au sort sera refait avec tous les joueurs (les codes existants ne changent pas).'))return;
  try{const j=await api('addplayers',{text:t});S=await loadState();adm=await api('admin');alert(j.added+(j.added>1?' joueurs ajoutés':' joueur ajouté')+(regOpen()?'.':'. Le tirage au sort a été refait.'))}
  catch(e){alert(e.message==='none'?'Ces prénoms sont déjà dans le tournoi.':e.message==='started'?'Le tournoi est déjà lancé : on ne peut plus ajouter de joueur.':'Erreur : '+e.message)}
  lastSig='';render();
}
async function startT(){
  if(!confirm('Lancer officiellement le tournoi ? Les joueurs pourront jouer tout de suite.'))return;
  try{await api('start');S=await loadState()}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function unlock(id){
  try{await api('unlock',{id});adm=await api('admin')}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
let admSt={key:'',s:''},admTimer=null;
async function adm2(a,id,loser){
  if(a==='forfeit'&&!confirm('Confirmer l\'élimination ? Cette action est définitive.'))return;
  const key=a+':'+id+(loser?':'+loser:'');
  clearTimeout(admTimer);admSt={key,s:'busy'};lastSig='';render();
  try{
    await api(a,{id,loser});
    admSt={key,s:'ok'};lastSig='';
    if(a==='forfeit'){render();await new Promise(r=>setTimeout(r,1100));S=await loadState();admSt={key:'',s:''}}   // le match disparaît de la liste : on laisse voir le « ✓ » une seconde
    else{S=await loadState();render();admTimer=setTimeout(()=>{admSt={key:'',s:''};lastSig='';render()},2000);return}
  }catch(e){admSt={key:'',s:''};alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function adminLogin(){
  adminKey=$('#ak').value.trim();
  try{adm=await api('admin');ls.set('bt_ak',adminKey)}catch(e){adminKey='';alert(e.status===401?'Clé incorrecte.':'Erreur serveur : '+e.message)}
  render();
}
async function createT(){
  try{await api('create',{text:$('#names').value});S=await loadState();adm=await api('admin')}
  catch(e){alert(e.message==='min2'?'Entre au moins 2 prénoms.':'Erreur lors de la création.')}
  render();
}
async function resetT(){
  if(!confirmReset){confirmReset=true;render();return}
  confirmReset=false;
  try{await api('reset');S=await loadState();adm=null;tok=null;ls.del('bt_tok')}catch(e){}
  render();
}
</script></body></html>
