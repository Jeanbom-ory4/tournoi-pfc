<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Chifoumi — Édition RSP 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg1:#2e1065;--bg2:#be185d;--card:rgba(255,255,255,.14)}
body{margin:0;min-height:100vh;color:#fff;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:1.25rem}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .5s}@keyframes pp{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
button{touch-action:manipulation}
</style></head>
<body><div class="max-w-md mx-auto p-3"><h1 id="ttl" class="text-center text-2xl font-black py-2"></h1><div id="app"></div></div>
<script>
const STONE='<svg viewBox="2 7 60 52" width="1.3em" height="1.13em" style="display:inline-block;vertical-align:-.2em" aria-label="Pierre"><path d="M9 45C5 34 11 22 21 18C27 11 40 11 46 18C56 22 61 34 56 45C54 53 44 55 32 55C20 55 11 53 9 45Z" fill="#9ca3af" stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/><path d="M10 45C12 51 20 55 32 55C44 55 54 52 56 45C50 49 40 50 31 49C21 48 14 47 10 45Z" fill="#6b7280"/><path d="M19 27C23 20 31 18 38 19C32 21 27 24 25 31Z" fill="#e5e7eb"/><path d="M40 25L35 34L42 39" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const E={r:STONE,f:'📄',c:'✂️'},N={r:'Pierre',f:'Feuille',c:'Ciseaux'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S={cfg:null,matches:{}},tok=ls.get('pfc_tok'),adminKey=ls.get('pfc_ak')||'',adm=null,tab='jeu',sel=null,lg={id:null,pin:'',err:false},remember=true,busy=false,prevTurn=null,loaded=false,confirmReset=false,loadErr=null,lastSig='',skew=0,watch=null,confSig='',confRaf=null,aboutOpen={rules:true,hist:false};
$('#ttl').innerHTML='<div>'+STONE+' 📄 ✂️</div><div class="text-lg mt-1">Master Chifoumi — Édition RSP 2026</div>';

async function api(action,extra){
  const r=await fetch('/api/pfc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:tok,key:adminKey,...extra})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'erreur'),{status:r.status,data:j});
  return j;
}
const me=()=>tok?tok.split('.')[0]:null;
const pn=id=>{const p=S.cfg&&S.cfg.players.find(x=>x.id===id);return p?esc(p.name):null};
const raw=id=>{const p=S.cfg&&S.cfg.players.find(x=>x.id===id);return p?p.name:'?'};
const mk=(r,i)=>`m${r}_${i}`;
const rlabel=r=>{const k=S.cfg.rounds-r;return k===1?'Finale':k===2?'Demi-finales':k===3?'Quarts de finale':'Tour '+(r+1)};
const Q_LOSE="« Le vrai maître n'est pas celui qui gagne toujours, mais celui qui sait lire le monde avec patience et simplicité. »";
const Q_THIRD="« La victoire est belle, mais la plus grande richesse reste le chemin parcouru ensemble et le rire partagé. »";
const quoteP=q=>`<p class="text-center italic mt-4 text-lg leading-relaxed">${q}</p>`;
const CAL=`<svg viewBox="0 0 24 24" width="1.15em" height="1.15em" style="display:inline-block;vertical-align:-.2em" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="#fff"/><path d="M3 8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v3H3z" fill="#ef4444"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="#6b7280"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="#6b7280"/><g fill="#cbd5e1"><rect x="6.5" y="13" width="3" height="2.4" rx=".6"/><rect x="10.5" y="13" width="3" height="2.4" rx=".6"/><rect x="14.5" y="13" width="3" height="2.4" rx=".6"/><rect x="6.5" y="16.7" width="3" height="2.4" rx=".6"/><rect x="10.5" y="16.7" width="3" height="2.4" rx=".6"/></g></svg>`;
const fmtWhen=ms=>new Date(ms).toLocaleString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const toInput=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16);
const mlabel=m=>m.id==='third'?'Petite finale (3e place)':rlabel(m.r);
const wrap=h=>`<div class="card p-4 mb-3">${h}</div>`;
const now=()=>Date.now()+skew;
function norm(j){if(j&&j.now){skew=j.now-Date.now();delete j.now}return j}
const loadState=async()=>norm(await api('state'));
const cd=ms=>{if(ms<=0)return 'délai dépassé';const h=Math.floor(ms/3.6e6),mn=Math.floor(ms%3.6e6/6e4);return h+' h '+String(mn).padStart(2,'0')};
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(el=>{const d=+el.dataset.cd-now();el.textContent=cd(d);if(d<=0&&!document.hidden)refresh()}),30000);

// Déconnecte automatiquement si le tournoi a été réinitialisé (jeton d'un ancien tournoi)
function checkSession(){if(tok&&S.cfg&&(tok.split('.')[1]!==(S.cfg.tid||'')||!pn(me()))){tok=null;ls.del('pfc_tok')}}
async function refresh(){
  const f=document.activeElement;
  if(f&&/TEXTAREA|INPUT/.test(f.tagName)&&f.id!=='pin')return;   // ne pas écraser une saisie en cours
  try{S=await loadState();loadErr=null}catch(e){loadErr=e.message+(e.status?' (HTTP '+e.status+')':'')}
  loaded=true;
  if(adminKey&&tab==='admin'){try{adm=await api('admin')}catch(e){if(e.status===401){adminKey='';ls.del('pfc_ak')}}}
  checkSession();
  const sig=JSON.stringify([S,loadErr,adm,tok,loaded]);
  if(sig===lastSig)return;   // rien n'a changé : on ne redessine pas
  lastSig=sig;render();
}
setInterval(()=>{if(!document.hidden)refresh()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
refresh();

function render(){
  const app=$('#app'),hadFocus=document.activeElement&&document.activeElement.id==='pin';
  if(!loaded){app.innerHTML=wrap('<p class="text-center">Chargement…</p>');return}
  const tabs=[['jeu','🎮 Jouer'],['tableau','🏆 Tableau'],['apropos','ℹ️ À propos'],['admin','⚙️ Orga']];
  const nav=`<div class="flex gap-2 mb-3">${tabs.map(t=>`<button onclick="setTab('${t[0]}')" class="flex-1 py-3 px-1 text-sm rounded-2xl font-bold ${tab===t[0]?'bg-white text-purple-800':'card'}">${t[1]}${t[0]==='jeu'&&tab!=='jeu'&&myTurn()?' 🔴':''}</button>`).join('')}</div>`;
  const err=loadErr?wrap('<p class="text-center font-bold">⚠️ Serveur injoignable</p><p class="text-center text-sm mt-1 break-words">'+esc(loadErr)+'</p>'):'';
  app.innerHTML=nav+err+(tab==='jeu'?jeuView():tab==='tableau'?bracketView():tab==='apropos'?aboutView():adminView());
  if(hadFocus&&$('#pin')){const i=$('#pin');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  if(tab==='admin')drawQR();
  notifyCheck();
  champCheck();
}
function setTab(t){tab=t;watch=null;if(t==='admin'&&adminKey)api('admin').then(a=>{adm=a;render()}).catch(()=>{});render()}

/* ---------- Joueur ---------- */
function myMatch(){
  const id=me();
  return Object.entries(S.matches).map(([k,m])=>({id:k,...m})).filter(m=>(m.a===id||m.b===id)&&m.a&&m.b).sort((x,y)=>x.r-y.r).find(m=>!m.w)||null;
}
function jeuView(){
  if(!S.cfg)return wrap('<p class="text-center">Le tournoi n\'a pas encore été créé par l\'organisateur.</p>');
  const id=me(),when=S.cfg.started===false&&S.cfg.startAt?fmtWhen(S.cfg.startAt):'';
  if(!id)return (when?wrap('<p class="text-center font-bold">'+CAL+' Coup d\'envoi prévu : '+when+'</p>'):'')+loginView();
  let head=`<div class="flex justify-between items-center mb-3"><span class="font-bold">👋 ${pn(id)}</span><button onclick="logout()" class="text-sm underline opacity-80">Changer de joueur</button></div>`;
  if(window.Notification&&Notification.permission==='default')head+=`<button onclick="askNotif()" class="w-full mb-3 py-2 rounded-xl card text-sm font-bold">🔔 Activer les alertes</button>`;
  if(S.cfg.started===false)return wrap(head+'<p class="text-center text-4xl">🚦</p><p class="text-center font-bold mt-2">Le tournoi n\'a pas encore commencé.</p><p class="text-center mt-2 text-sm">L\'organisateur donnera bientôt le coup d\'envoi. Reviens un peu plus tard !</p>'+(when?'<p class="text-center mt-3 font-bold">'+CAL+' Coup d\'envoi prévu : '+when+'</p>':''));
  const m=myMatch();
  if(!m){
    const fin=S.matches[mk(S.cfg.rounds-1,0)];
    if(fin&&fin.w===id)return wrap(head+'<p class="text-center text-3xl font-black">🏆 Champion !</p><p class="text-center mt-2">Bravo, tu remportes le tournoi !</p><p class="text-center italic mt-4 text-lg leading-relaxed">« La pierre apprend la solidité, la feuille la souplesse, le ciseau la précision. Le sage, lui, sait quand utiliser chacune. »</p><button onclick="confetti()" class="w-full mt-4 py-3 rounded-2xl bg-yellow-300 text-yellow-950 font-black">🎉 Relancer les confettis</button>');
    const ffm=Object.values(S.matches).find(x=>x.ff===id);
    if(ffm&&ffm.r<S.cfg.rounds-1)return wrap(head+'<p class="text-center font-bold">⏱ Délai dépassé : tu as été éliminé(e).</p><p class="text-center mt-2 text-sm">Tu n\'as pas joué dans les '+S.cfg.hours+' h. Suis la suite dans l\'onglet Tableau.</p><p class="text-center mt-3">Merci d\'avoir participé !</p>');
    const th=S.matches.third;
    if(th&&(th.a===id||th.b===id)){
      if(th.w)return wrap(head+(th.w===id?'<p class="text-center text-3xl font-black">🥉 Troisième place !</p><p class="text-center mt-2">Bravo, tu montes sur le podium !</p>'+quoteP(Q_THIRD):'<p class="text-center font-bold">Tu termines 4e de ce tournoi.</p><p class="text-center mt-2 text-sm">Merci d\'avoir joué !</p>'+quoteP(Q_LOSE)));
      return wrap(head+'<p class="text-center font-bold">⏳ En attente de l\'adversaire de la petite finale…</p><p class="text-center mt-2 text-sm">Reviens un peu plus tard.</p>');
    }
    if(fin&&fin.w&&(fin.a===id||fin.b===id))return wrap(head+'<p class="text-center text-3xl font-black">🥈 Deuxième place !</p><p class="text-center mt-2">Bravo pour cette finale !</p>'+quoteP(Q_LOSE));
    if(fin&&fin.w)return wrap(head+`<p class="text-center font-bold">Le tournoi est terminé.</p><p class="text-center mt-2">🏆 Vainqueur : ${pn(fin.w)}</p>`);
    const lostM=Object.values(S.matches).find(x=>x.w&&x.a&&x.b&&(x.a===id||x.b===id)&&x.w!==id),lost=!!lostM,early=!!lostM&&lostM.id!=='third'&&lostM.r<S.cfg.rounds-2;
    return wrap(head+(lost?(early?'<p class="text-center font-bold">😢 Tu es éliminé(e).</p><p class="text-center mt-2">Merci d\'avoir joué !</p>'+quoteP(Q_LOSE)+'<p class="text-center mt-4 text-sm">Suis la suite dans l\'onglet Tableau.</p>':'<p class="text-center font-bold">😢 Tu es éliminé(e).</p><p class="text-center mt-2 text-sm">Suis la suite dans l\'onglet Tableau.</p>'):'<p class="text-center font-bold">⏳ En attente de l\'adversaire du prochain tour…</p><p class="text-center mt-2 text-sm">Reviens un peu plus tard.</p>'));
  }
  const side=m.a===id?'a':'b',o=side==='a'?'b':'a',opp=m[o],mine=m['s'+side],theirs=m['s'+o];
  const locked=m.pend&&m.pend.by===side;
  const score=`<div class="text-center"><div class="text-sm opacity-80">${mlabel(m)} · premier à ${m.need||3} victoires</div><div class="text-5xl font-black my-2">${mine} - ${theirs}</div><div class="font-semibold">Toi vs ${pn(opp)}</div></div>`;
  let status,act='';
  if(locked)status=`<div class="mt-4 p-3 rounded-2xl bg-yellow-400 text-yellow-950 font-bold text-center">🔒 Coup verrouillé. En attente du coup de ${pn(opp)}...${m.due?`<div class="text-xs font-semibold mt-1">⏱ ${pn(opp)} doit jouer avant d'être éliminé(e) : reste <span data-cd="${m.due}">${cd(m.due-now())}</span></div>`:''}</div>`;
  else{
    status=`<div class="mt-4 p-3 rounded-2xl bg-emerald-400 text-emerald-950 font-bold text-center text-lg">À ton tour de jouer !${m.due?`<div class="text-sm font-semibold mt-1">⏱ Il te reste <span data-cd="${m.due}">${cd(m.due-now())}</span> pour jouer, sinon tu seras éliminé(e).</div>`:''}</div>`;
    act=`<div class="grid grid-cols-3 gap-2 mt-3">${['r','f','c'].map(k=>`<button onclick="sel='${k}';render()" class="rounded-2xl py-5 flex flex-col items-center gap-1 font-bold border-4 ${sel===k?'bg-white text-purple-800 border-yellow-300 scale-105':'card border-transparent'}"><span class="text-5xl">${E[k]}</span><span class="text-sm">${N[k]}</span></button>`).join('')}</div>
    <button ${sel&&!busy?'':'disabled'} onclick="play('${m.id}')" class="w-full mt-3 py-4 rounded-2xl font-black text-lg ${sel?'bg-yellow-300 text-yellow-950':'bg-white/20 text-white/60'}">${busy?'Envoi…':'Valider mon coup 🔒'}</button>
    <p class="text-xs text-center mt-2 opacity-80">Une fois validé, le coup ne peut plus être changé.</p>`;
  }
  let last='';
  if(m.hist&&m.hist.length){
    const h=m.hist[m.hist.length-1],r=h.w==='='?['🤝 Égalité, on rejoue','bg-slate-500']:h.w===side?['🎉 Tour gagné !','bg-emerald-500']:['😬 Tour perdu','bg-rose-500'];
    last=`<div class="mt-4 p-3 rounded-2xl ${r[1]} text-center pop"><div class="text-xs opacity-90">Dernier tour révélé</div><div class="text-4xl my-1">${E[h[side]]} <span class="text-xl">vs</span> ${E[h[o]]}</div><div class="font-bold">${r[0]}</div></div>
    <div class="mt-3 flex flex-wrap gap-1 justify-center text-sm">${m.hist.map((x,i)=>`<span class="px-2 py-1 rounded-full bg-white/15">${i+1}. ${E[x[side]]}${E[x[o]]} ${x.w==='='?'=':x.w===side?'✅':'❌'}</span>`).join('')}</div>`;
  }
  return wrap(head+score+status+act+last);
}
function loginView(){
  if(!lg.id)return wrap(`<p class="font-bold text-center mb-3">Qui es-tu ?</p><div class="grid grid-cols-2 gap-2">${[...S.cfg.players].sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'})).map(p=>`<button onclick="lg={id:'${p.id}',pin:'',err:false};render()" class="card py-4 px-2 font-bold truncate">${esc(p.name)}</button>`).join('')}</div>`);
  return wrap(`<p class="font-bold text-center">${pn(lg.id)}</p><p class="text-center text-sm mb-3 opacity-80">Saisis ton code à 4 caractères (lettres et chiffres)</p>
  <input id="pin" value="${lg.pin}" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" oninput="pinIn(this)" placeholder="••••" class="block mx-auto w-48 text-center text-3xl font-black uppercase rounded-xl p-3 text-slate-900 ${lg.err?'shake':''}" style="letter-spacing:.35em">
  <p class="text-center text-sm min-h-[1.25rem] mt-2 text-yellow-200">${lg.err?(lg.msg||'Code incorrect'):''}</p>
  <label class="flex items-center justify-center gap-2 text-sm my-2"><input type="checkbox" ${remember?'checked':''} onchange="remember=this.checked" class="w-5 h-5"> Mémoriser ma connexion</label>
  <button onclick="lg={id:null,pin:'',err:false};render()" class="block mx-auto mt-2 text-sm underline opacity-80">← Retour</button>`);
}
async function pinIn(el){
  lg.pin=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);el.value=lg.pin;lg.err=false;
  if(lg.pin.length<4)return;
  try{const j=await api('login',{id:lg.id,pin:lg.pin});tok=j.token;if(remember)ls.set('pfc_tok',tok);else ls.del('pfc_tok');lg={id:null,pin:'',err:false};sel=null;prevTurn=null}
  catch(e){
    lg.pin='';lg.err=true;
    const d=e.data||{};
    if(e.status===429)lg.msg='Trop d\'essais : réessaie dans '+Math.max(1,Math.ceil((d.retry||600)/60))+' min.';
    else lg.msg='Code incorrect'+(d.left>0&&d.left<=3?' ('+d.left+' essai'+(d.left>1?'s':'')+' restant'+(d.left>1?'s':'')+')':'');
  }
  render();
}
function logout(){tok=null;ls.del('pfc_tok');sel=null;prevTurn=null;render()}
async function play(id){
  if(!sel||busy)return;busy=true;render();
  try{S=norm(await api('play',{id,mv:sel}));sel=null}catch(e){if(e.status===401){tok=null;ls.del('pfc_tok')}alert(e.status===401?'Ta connexion n\'est plus valide : reconnecte-toi.':e.message==='deadline'?'Le délai est dépassé : tu es éliminé(e) de ce match.':e.message==='notstarted'?'Le tournoi n\'a pas encore été lancé par l\'organisateur.':'Erreur, réessaie.');refresh()}
  busy=false;render();
}

/* ---------- Confettis du champion ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let cv=document.getElementById('cf');
  if(!cv){cv=document.createElement('canvas');cv.id='cf';cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999';document.body.appendChild(cv)}
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const colors=['#ff3b6b','#ffd23f','#3bceac','#4cc9f0','#b388ff','#ff9f1c','#7cfc00'],P=[];
  const burst=(x,y,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(5+Math.random()*10)*dpr;P.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*v,vy:Math.sin(a)*v-8*dpr,w:(6+Math.random()*6)*dpr,h:(4+Math.random()*5)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],life:0})}};
  burst(W/2,H*.4,170);
  setTimeout(()=>burst(W*.2,H*.5,90),250);
  setTimeout(()=>burst(W*.8,H*.5,90),450);
  cancelAnimationFrame(confRaf);
  const t0=Date.now(),step=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of P){p.vy+=.35*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-p.life/220);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(Date.now()-t0<6000)confRaf=requestAnimationFrame(step);else cv.remove();
  };
  confRaf=requestAnimationFrame(step);
}
// Déclenche l'explosion une seule fois par appareil, dès que le joueur connecté est vu comme champion
function champCheck(){
  const id=me(),fin=S.cfg&&S.matches[mk(S.cfg.rounds-1,0)];
  if(!id||!fin||fin.w!==id)return;
  const sig=id+'|'+(fin.hist||[]).map(h=>h.a+h.b).join('');
  if(confSig===sig||ls.get('pfc_conf')===sig)return;
  confSig=sig;ls.set('pfc_conf',sig);confetti();
}

/* ---------- Alertes (page ouverte) ---------- */
function myTurn(){if(!S.cfg||S.cfg.started===false||!me())return false;const m=myMatch();return !!m&&!(m.pend&&m.pend.by===(m.a===me()?'a':'b'))}
function notifyCheck(){
  const t=myTurn();
  if(prevTurn!==null&&t&&!prevTurn)alertTurn();
  prevTurn=t;
  document.title=(t?'🔔 À toi de jouer ! · ':'')+'Master Chifoumi — Édition RSP 2026';
}
function alertTurn(){
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification('À toi de jouer !',{body:'Un match t’attend au tournoi.'})}catch(e){}
}
async function askNotif(){try{await Notification.requestPermission()}catch(e){}render()}

/* ---------- Tableau ---------- */
function bracketView(){
  if(!S.cfg)return wrap('<p class="text-center">Aucun tournoi pour le moment.</p>');
  if(watch)return matchView(watch);
  const fin=S.matches[mk(S.cfg.rounds-1,0)],th=S.matches.third,id=me(),pw=x=>x&&x!=='none'?pn(x):'—';
  const card=m=>{
    const row=(pid,s)=>`<div class="flex justify-between gap-2 px-2 py-1 rounded ${m.w&&m.w===pid?'bg-emerald-500/40 font-bold':''} ${pid&&pid===id?'ring-1 ring-yellow-300':''}"><span class="truncate">${pid?pn(pid)+(m.ff===pid?' ⏱':''):(m.r===0?'Exempt':'À définir')}</span><span>${s}</span></div>`;
    const k=m.id||mk(m.r,m.i),open=m.a&&m.b;
    return `<div ${open?`role="button" tabindex="0" onclick="openMatch('${k}')"`:''} style="height:64px" class="card p-1 text-sm ${open?'cursor-pointer active:scale-95':''}">${row(m.a,m.sa)}${row(m.b,m.sb)}</div>`;
  };
  let out='';
  if(fin&&fin.w){const sec=fin.w===fin.a?fin.b:fin.a;out=`<div class="card p-3 mb-3 text-center pop"><div class="font-black text-xl">🏆 Champion : ${pn(fin.w)}</div><div class="mt-2 text-sm">🥈 ${pn(sec)}${th?' · 🥉 '+(th.w?pw(th.w):'petite finale en cours'):''}</div></div>`}
  let cols='';
  const R=S.cfg.rounds,line='background:#fff',dash='#fff',LAB=56,CARD=64;
  for(let r=0;r<R;r++){
    let cs='';const H=80*2**r;   // chaque match du tour r occupe une « case » de hauteur H : la carte y est centrée, donc centrée entre ses deux matchs précédents
    for(let i=0;i<S.cfg.size/2**(r+1);i++){
      const m=S.matches[mk(r,i)];
      let conn=(r<R-1?`<div style="position:absolute;right:-12px;top:50%;width:12px;height:2px;${line}"></div><div style="position:absolute;right:-12px;width:2px;${i%2?'bottom:50%':'top:50%'};height:${H/2}px;${line}"></div>`:'')+(r>0?`<div style="position:absolute;left:-12px;top:50%;width:12px;height:2px;${line}"></div>`:'');
      if(th&&R>=2&&r===R-2){   // traits en pointillés : demi-finales -> petite finale (sous la finale)
        const L=i===0?H:2*H+LAB+CARD/2-(i*H+H/2);   // 1re demi-finale : jusqu'à la 2e ; 2e demi-finale : jusqu'à la petite finale (pas de superposition)
        conn+=`<div style="position:absolute;right:-6px;top:50%;height:${L}px;border-left:2px dashed ${dash}"></div>`+(i===1?`<div style="position:absolute;right:-24px;top:calc(50% + ${L}px);width:18px;border-top:2px dashed ${dash}"></div>`:'');
      }
      cs+=`<div class="flex items-center" style="position:relative;height:${H}px"><div class="w-full">${m?card(m):''}</div><div style="position:absolute;left:0;top:0;right:0;bottom:0;opacity:.45;pointer-events:none">${conn}</div></div>`;
    }
    if(th&&r===R-1)cs+=`<div class="text-center" style="height:${LAB}px"><div class="text-sm font-bold">🥉 Petite finale</div><div class="leading-4 opacity-90" style="font-size:13px">perdants des demi-finales</div></div><div style="height:${CARD}px">${card(th)}</div>`;
    cols+=`<div class="min-w-[9.5rem]"><div class="text-xs font-bold text-center mb-2 opacity-90">${rlabel(r)}</div>${cs}</div>`;
  }
  return out+`<p class="text-xs text-center opacity-80 mb-2">👁 Touche un match pour le suivre en spectateur.</p><div class="overflow-x-auto"><div class="flex gap-6 pb-1">${cols}</div></div>`;
}
function openMatch(k){watch=k;render();window.scrollTo(0,0)}
function matchView(k){
  const m=S.matches[k],back=`<button onclick="watch=null;render()" class="mb-3 px-3 py-2 rounded-xl card text-sm font-bold">← Retour au tableau</button>`;
  if(!m)return back+wrap('<p class="text-center">Match introuvable.</p>');
  const A=pn(m.a)||'À définir',B=pn(m.b)||'À définir',pl=pn(m.pend?(m.pend.by==='a'?m.a:m.b):null),wt=pn(m.pend?(m.pend.by==='a'?m.b:m.a):null);
  const st=m.w?`<div class="mt-3 p-3 rounded-2xl bg-emerald-500 text-center font-bold">🏁 Vainqueur : ${pn(m.w)||'—'}${m.ff?`<div class="text-xs font-normal mt-1">⏱ ${pn(m.ff)} éliminé(e) : délai dépassé</div>`:''}</div>`
    :m.pend?`<div class="mt-3 p-3 rounded-2xl bg-yellow-400 text-yellow-950 text-center font-bold">🔒 ${pl} a joué son coup (secret). En attente de ${wt}...${m.due?`<div class="text-xs font-semibold mt-1">⏱ reste <span data-cd="${m.due}">${cd(m.due-now())}</span></div>`:''}</div>`
    :`<div class="mt-3 p-3 rounded-2xl card text-center">${m.a&&m.b?'Prochain tour à jouer…':'Match pas encore défini'}</div>`;
  const hist=(m.hist||[]).map((x,i)=>`<div class="flex items-center justify-between gap-2 py-2 border-b border-white/20 text-sm"><span class="opacity-80">Tour ${i+1}</span><span class="text-2xl">${E[x.a]} <span class="text-sm">vs</span> ${E[x.b]}</span><span class="text-right font-semibold">${x.w==='='?'🤝 Égalité':'✅ '+pn(x.w==='a'?m.a:m.b)}</span></div>`).join('');
  return back+wrap(`<div class="text-center text-sm opacity-80">${mlabel(m)} · premier à ${m.need||3} victoires</div>
    <div class="flex items-center justify-around gap-2 my-3"><div class="flex-1 text-center font-bold truncate">${A}</div><div class="text-4xl font-black">${m.sa} - ${m.sb}</div><div class="flex-1 text-center font-bold truncate">${B}</div></div>${st}
    ${hist?`<div class="mt-4"><div class="text-xs font-bold opacity-90 mb-1">Tours joués</div>${hist}</div>`:'<p class="text-center text-sm mt-3 opacity-80">Aucun tour joué pour le moment.</p>'}
    <p class="text-xs text-center mt-3 opacity-70">👁 Mode spectateur : un coup en attente reste secret tant que les deux joueurs n'ont pas joué.</p>`);
}

function aboutView(){
  return wrap(`<h2 class="text-xl font-black text-center mb-3">À propos</h2>
  <p class="mb-3">Bienvenue dans ce grand tournoi de Pierre-Feuille-Ciseaux !</p>
  <p class="mb-3">L'objectif de cette application est simple : proposer une animation conviviale pour favoriser le team-connect et apporter une bonne dose de having-fun au sein de l'équipe de l'après-midi. C'est l'occasion de partager un moment sympa, de créer du lien entre collègues et de se défier dans un esprit 100 % ludique et bon enfant.</p>
  <div class="rounded-xl bg-yellow-300/20 p-3 mb-3"><p class="font-bold mb-1">⚠️ Rappel important :</p><p>Pour le bon déroulement de l'activité et le respect du cadre de travail, l'ensemble des matchs doit se jouer strictement durant vos temps de pause ou en dehors de vos heures de travail. Merci à chacun d'être vigilant afin de préserver l'organisation et la sécurité de tous.</p></div>
  <div class="rounded-xl bg-rose-400/20 p-3 mb-3"><p class="font-bold mb-1">⏱ Règle des ${S.cfg&&S.cfg.hours||48} heures</p><p>Une fois que ton adversaire a joué son coup, tu as ${S.cfg&&S.cfg.hours||48} h pour jouer le tien, sinon tu es éliminé(e) du tournoi. Un compte à rebours s'affiche sur ton écran. Aucun message de rappel n'est envoyé : pense à passer régulièrement sur l'application !</p></div>
  <details ${aboutOpen.rules?'open':''} ontoggle="aboutOpen.rules=this.open" class="rounded-xl bg-white/10 p-3 mb-3"><summary class="font-bold cursor-pointer">🎮 Comment jouer ?</summary>
    <p class="mt-3 mb-2">Chaque joueur choisit en secret un des trois signes : <b>Pierre</b>, <b>Feuille</b> ou <b>Ciseaux</b>. Les deux signes sont ensuite révélés et le plus fort gagne le tour :</p>
    <ul class="space-y-1 mb-3 text-lg">
      <li>${STONE} <b>Pierre</b> écrase ✂️ <b>Ciseaux</b></li>
      <li>✂️ <b>Ciseaux</b> coupent 📄 <b>Feuille</b></li>
      <li>📄 <b>Feuille</b> enveloppe ${STONE} <b>Pierre</b></li>
    </ul>
    <p class="mb-2">Si les deux joueurs choisissent le même signe, c'est une <b>égalité</b> : on rejoue le tour.</p>
    <p class="mb-2">Un match se gagne en <b>3 victoires</b>, sauf la finale qui se joue en <b>5 victoires</b>.</p>
    <p>Pas besoin d'être connecté en même temps que ton adversaire : une fois ton coup validé, il reste secret et ne peut plus être changé. Il n'est révélé que lorsque ton adversaire a joué le sien.</p>
  </details>
  <details ${aboutOpen.hist?'open':''} ontoggle="aboutOpen.hist=this.open" class="rounded-xl bg-white/10 p-3 mb-3"><summary class="font-bold cursor-pointer">📜 Les Origines de Pierre-Feuille-Ciseaux</summary>
    <p class="font-bold mt-3 mb-1">1. Des banquets de la Chine antique</p>
    <p class="mb-3">Selon un texte chinois rédigé vers 1600, le jeu remonterait à la dynastie Han (206 av. J.-C. – 220 ap. J.-C.), soit il y a plus de 2 000 ans. Il y est question du Shǒushìlìng (« le jeu des signes de mains »), un jeu de réflexe que l'on dit populaire lors des banquets, où le perdant devait boire un gage.</p>
    <p class="font-bold mb-1">2. L'évolution japonaise et le « Janken »</p>
    <p class="mb-3">Venu de Chine, le jeu arrive au Japon (vers le XVIIᵉ siècle selon plusieurs sources), où l'on pratique de nombreux jeux de poing appelés « sansukumi-ken » : trois signes qui se battent en cercle, comme dans notre jeu. C'est au Japon que ces jeux évoluent vers la version moderne que nous connaissons aujourd'hui : le Janken (avec la Pierre, la Feuille et les Ciseaux). Le mot français Chifoumi vient d'ailleurs très probablement du comptage japonais (Hi-Fu-Mi, 1-2-3) !</p>
    <p class="font-bold mb-1">3. La conquête du monde</p>
    <p>Au XXᵉ siècle, le jeu quitte l'Asie pour l'Occident et se diffuse à travers la planète. Malgré sa simplicité apparente, il est devenu un sujet d'étude en théorie des jeux et en psychologie : car au-delà du hasard, gagner au Chifoumi repose sur l'observation, le rythme et la lecture de son adversaire.</p>
  </details>
  <p class="font-semibold text-center">Bons matchs et que le/la meilleur(e) gagne !</p>`);
}

/* ---------- Organisateur ---------- */
function waiting(){
  const out=[];
  for(const m of Object.values(S.matches)){
    if(m.w||!m.a||!m.b)continue;
    if(!m.pend||m.pend.by==='b')out.push(m.a);
    if(!m.pend||m.pend.by==='a')out.push(m.b);
  }
  return out;
}
function startCard(){
  if(S.cfg.started!==false)return wrap(`<p class="font-bold">✅ Tournoi lancé</p>`);
  const cur=S.cfg.startAt;
  return wrap(`<p class="font-bold mb-1">🚦 Le tournoi n'a pas encore démarré</p><p class="text-sm opacity-90 mb-3">Les joueurs peuvent se connecter et voir le tableau, mais ils ne pourront pas jouer tant que tu n'as pas lancé le tournoi.</p><button onclick="startT()" class="w-full py-4 rounded-2xl bg-emerald-400 text-emerald-950 font-black text-lg">🚀 Lancer le tournoi</button>`)
    +wrap(`<p class="font-bold mb-1">${CAL} Annoncer la date de lancement</p><p class="text-sm opacity-90 mb-2">Les joueurs la voient dans la rubrique « Jouer ». Le tournoi ne démarre pas tout seul : c'est toi qui appuies sur « Lancer le tournoi ».</p>${cur?`<p class="text-sm font-semibold mb-2">Annoncé : ${fmtWhen(cur)}</p>`:''}<input id="startAt" type="datetime-local" value="${cur?toInput(cur):''}" class="w-full rounded-xl p-3 text-slate-900"><div class="flex gap-2 mt-2"><button onclick="saveStart(false)" class="flex-1 py-3 rounded-2xl bg-yellow-300 text-yellow-950 font-black">Enregistrer</button>${cur?'<button onclick="saveStart(true)" class="px-4 py-3 rounded-2xl card font-bold">Effacer</button>':''}</div>`)
    +wrap(`<p class="font-bold mb-1">➕ Ajouter des joueurs</p><p class="text-sm opacity-90 mb-2">Possible tant que le tournoi n'est pas lancé. Un prénom par ligne. Le tirage au sort est refait avec tous les joueurs ; les codes existants ne changent pas, et les nouveaux codes apparaissent dans la liste ci-dessous.</p><textarea id="newNames" rows="4" class="w-full rounded-xl p-3 text-slate-900" placeholder="Prénom&#10;Prénom"></textarea><button onclick="addPlayers()" class="w-full mt-2 py-3 rounded-2xl bg-yellow-300 text-yellow-950 font-black">Ajouter au tournoi</button>`);
}
function adminView(){
  if(!adminKey)return wrap(`<p class="font-bold mb-2">Espace organisateur</p><input id="ak" type="password" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Clé organisateur (ADMIN_KEY)" class="w-full rounded-xl p-3 text-slate-900"><button onclick="adminLogin()" class="w-full mt-3 py-3 rounded-2xl bg-yellow-300 text-yellow-950 font-black">Entrer</button>`);
  if(!S.cfg)return wrap(`<p class="font-bold mb-2">Créer le tournoi</p><p class="text-sm opacity-90 mb-2">Un prénom par ligne (minimum 2). L'arbre est tiré au sort ; les joueurs en trop sont exemptés au 1er tour.</p>
    <textarea id="names" rows="8" class="w-full rounded-xl p-3 text-slate-900" placeholder="Alice&#10;Bruno&#10;Chloé&#10;David"></textarea>
    <button onclick="createT()" class="w-full mt-3 py-4 rounded-2xl bg-yellow-300 text-yellow-950 font-black">Générer le tournoi 🚀</button>`);
  let h=startCard()+wrap(`<p class="font-bold mb-2">Accès pour les collègues</p><div class="flex justify-center my-3"><div id="qr" class="bg-white p-3 rounded-xl"></div></div><p class="text-xs text-center break-all opacity-90">${esc(location.origin+location.pathname)}</p>`);
  if(adm)h+=wrap(`<p class="font-bold mb-2">Codes d'accès à distribuer</p><div class="text-sm">${S.cfg.players.map(p=>{const lk=(adm.locks||{})[p.id],lockOn=lk&&lk>now();return `<div class="py-1 border-b border-white/20"><div class="flex justify-between"><span>${esc(p.name)}</span><b class="tracking-widest">${esc(adm.pins[p.id]||'—')}</b></div>${lockOn?`<div class="flex justify-between items-center text-xs text-yellow-200 mt-1"><span>🔒 Bloqué encore ~${Math.max(1,Math.ceil((lk-now())/60000))} min</span><button onclick="unlock('${p.id}')" class="px-2 py-1 rounded-lg bg-white/20 font-bold text-white">Débloquer</button></div>`:''}</div>`}).join('')}</div>`);
  const act=Object.entries(S.matches).filter(([k,m])=>!m.w&&m.a&&m.b);
  const bt=(l,c)=>`<button onclick="${c}" class="px-2 py-1 rounded-lg bg-white/20 text-xs font-bold">${l}</button>`;
  h+=wrap(`<p class="font-bold mb-2">⏳ Matchs en cours</p>${act.length?act.map(([k,m])=>{
    const head=`<div>${m.id==='third'?'🥉 ':m.r===S.cfg.rounds-1?'🏆 ':''}${pn(m.a)} ${m.sa}-${m.sb} ${pn(m.b)}</div>`;
    if(m.pend){const w=m.pend.by==='a'?m.b:m.a;return `<div class="py-2 border-b border-white/20 text-sm">${head}<div class="opacity-90">${pn(w)} doit jouer · reste <b data-cd="${m.due}">${cd(m.due-now())}</b></div><div class="flex gap-2 mt-1">${bt('+24 h',`adm2('extend','${k}')`)}${bt('Éliminer '+pn(w),`adm2('forfeit','${k}','${w}')`)}</div></div>`}
    return `<div class="py-2 border-b border-white/20 text-sm">${head}<div class="opacity-90">Aucun coup joué pour le moment</div><div class="flex gap-2 mt-1">${bt('Éliminer '+pn(m.a),`adm2('forfeit','${k}','${m.a}')`)}${bt('Éliminer '+pn(m.b),`adm2('forfeit','${k}','${m.b}')`)}</div></div>`}).join(''):'<p class="text-sm">Aucun match en cours.</p>'}`);
  h+=wrap(`<button onclick="resetT()" class="w-full py-3 rounded-2xl ${confirmReset?'bg-rose-600':'card'} font-bold">${confirmReset?'Confirmer : tout supprimer':'Réinitialiser le tournoi'}</button><button onclick="adminKey='';ls.del('pfc_ak');adm=null;render()" class="block mx-auto mt-3 text-sm underline opacity-80">Quitter l'espace organisateur</button>`);
  return h;
}
function drawQR(){const el=$('#qr');if(!el||!window.QRCode)return;el.innerHTML='';try{new QRCode(el,{text:location.origin+location.pathname,width:200,height:200})}catch(e){}}
async function saveStart(clear){
  const v=$('#startAt').value;
  if(!clear&&!v){alert('Choisis une date et une heure.');return}
  try{await api('schedule',{at:clear?null:new Date(v).getTime()});S=await loadState()}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function addPlayers(){
  const t=$('#newNames').value;
  if(!t.trim()){alert('Entre au moins un prénom.');return}
  if(!confirm('Ajouter ces joueurs ? Le tirage au sort sera refait avec tous les joueurs (les codes existants ne changent pas).'))return;
  try{const j=await api('addplayers',{text:t});S=await loadState();adm=await api('admin');alert(j.added+(j.added>1?' joueurs ajoutés':' joueur ajouté')+'. Le tirage au sort a été refait.')}
  catch(e){alert(e.message==='none'?'Ces prénoms sont déjà dans le tournoi.':e.message==='started'?'Le tournoi est déjà lancé : on ne peut plus ajouter de joueur.':'Erreur : '+e.message)}
  lastSig='';render();
}
async function startT(){
  if(!confirm('Lancer officiellement le tournoi ? Les joueurs pourront jouer tout de suite.'))return;
  try{await api('start');S=await loadState()}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function unlock(id){
  try{await api('unlock',{id});adm=await api('admin')}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function adm2(a,id,loser){
  if(a==='forfeit'&&!confirm('Confirmer l\'élimination ? Cette action est définitive.'))return;
  try{await api(a,{id,loser});S=await loadState()}catch(e){alert('Erreur : '+e.message)}
  lastSig='';render();
}
async function adminLogin(){
  adminKey=$('#ak').value.trim();
  try{adm=await api('admin');ls.set('pfc_ak',adminKey)}catch(e){adminKey='';alert(e.status===401?'Clé incorrecte.':'Erreur serveur : '+e.message)}
  render();
}
async function createT(){
  try{await api('create',{text:$('#names').value});S=await loadState();adm=await api('admin')}
  catch(e){alert(e.message==='min2'?'Entre au moins 2 prénoms.':'Erreur lors de la création.')}
  render();
}
async function resetT(){
  if(!confirmReset){confirmReset=true;render();return}
  confirmReset=false;
  try{await api('reset');S=await loadState();adm=null;tok=null;ls.del('pfc_tok')}catch(e){}
  render();
}
</script></body></html>
